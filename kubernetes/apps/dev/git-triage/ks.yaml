---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: git-triage-db
  namespace: flux-system
spec:
  targetNamespace: dev
  path: ./kubernetes/apps/dev/git-triage/database
  prune: false
  dependsOn:
    - name: cloudnative-pg
    - name: longhorn
    - name: rustfs
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: >-
        status.conditions.exists(e,
          e.type == 'Ready' && e.status == 'True')
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: git-triage-migrate
  namespace: flux-system
spec:
  targetNamespace: dev
  path: ./kubernetes/apps/dev/git-triage/migration
  prune: true
  dependsOn:
    - name: git-triage-db
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: git-triage
  namespace: flux-system
spec:
  targetNamespace: dev
  path: ./kubernetes/apps/dev/git-triage/app
  prune: true
  dependsOn:
    - name: git-triage-migrate
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: git-triage
      namespace: dev
  interval: 30m
  retryInterval: 1m
  timeout: 5m
