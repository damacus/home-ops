---
policies:
  - uid: home-ops-rustfs-iam
    name: Home Ops RustFS IAM
    version: 1.0.0
    scoring_system: highest impact
    tags:
      mondoo.com/platform: os
      mondoo.com/category: security
    require:
      - provider: os
    authors:
      - name: Home Ops
        email: security@ironstone.casa
    docs:
      desc: |
        Validate that the RustFS bootstrap creates separate identities and
        bucket-scoped policies.
    groups:
      - title: RustFS IAM
        filters: asset.platform != ""
        checks:
          - uid: rustfs-bootstrap-creates-app-identities
            title: RustFS bootstrap creates separate application identities
            impact: 100
            mql: |
              file("kubernetes/apps/storage/rustfs-iam/app/bootstrap-script.yaml").content.contains("rustfs-cnpg-zitadel")
              file("kubernetes/apps/storage/rustfs-iam/app/bootstrap-script.yaml").content.contains("rustfs-cnpg-forgejo")
              file("kubernetes/apps/storage/rustfs-iam/app/bootstrap-script.yaml").content.contains("rustfs-cnpg-home-assistant")
              file("kubernetes/apps/storage/rustfs-iam/app/bootstrap-script.yaml").content.contains("rustfs-cnpg-n8n")
              file("kubernetes/apps/storage/rustfs-iam/app/bootstrap-script.yaml").content.contains("rustfs-cnpg-immich")
              file("kubernetes/apps/storage/rustfs-iam/app/bootstrap-script.yaml").content.contains("rustfs-cnpg-mealie")
              file("kubernetes/apps/storage/rustfs-iam/app/bootstrap-script.yaml").content.contains("rustfs-cnpg-med-tracker")
              file("kubernetes/apps/storage/rustfs-iam/app/bootstrap-script.yaml").content.contains("rustfs-cnpg-penpot")
              file("kubernetes/apps/storage/rustfs-iam/app/bootstrap-script.yaml").content.contains("rustfs-longhorn")
              file("kubernetes/apps/storage/rustfs-iam/app/bootstrap-script.yaml").content.contains("rustfs-paperless")
              file("kubernetes/apps/storage/rustfs-iam/app/bootstrap-script.yaml").content.contains("rustfs-loki")
              file("kubernetes/apps/storage/rustfs-iam/app/bootstrap-script.yaml").content.contains("rustfs-tempo")
          - uid: rustfs-bootstrap-attaches-bucket-scoped-policies
            title: RustFS bootstrap attaches bucket-scoped IAM policies
            impact: 100
            mql: |
              file("kubernetes/apps/storage/rustfs-iam/app/bootstrap-script.yaml").content.contains("arn:aws:s3:::")
              file("kubernetes/apps/storage/rustfs-iam/app/bootstrap-script.yaml").content.contains("rc admin policy")
              file("kubernetes/apps/storage/rustfs-iam/app/bootstrap-script.yaml").content.contains("rc admin user add")
              file("kubernetes/apps/storage/rustfs-iam/app/bootstrap-script.yaml").content.contains("rc admin policy attach")
              file("kubernetes/apps/storage/rustfs-iam/app/bootstrap-script.yaml").content.contains("rc admin policy detach")
              file("kubernetes/apps/storage/rustfs-iam/app/bootstrap-script.yaml").content.contains("rc admin group rm-members")
              file("kubernetes/apps/storage/rustfs-iam/app/bootstrap-script.yaml").content.contains("rc admin user rm")
              file("kubernetes/apps/storage/rustfs-iam/app/bootstrap-script.yaml").content.contains("mc admin") == false
