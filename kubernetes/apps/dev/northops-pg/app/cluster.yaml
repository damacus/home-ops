---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: northops-pg
  namespace: dev
spec:
  imagePullSecrets:
    - name: ghcr-credentials
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: 18
  instances: 2
  primaryUpdateStrategy: unsupervised
  enablePDB: true
  enableSuperuserAccess: false
  managed:
    roles:
      - name: ironbridge
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        passwordSecret:
          name: ironbridge-db
  bootstrap:
    initdb:
      database: ironbridge
      owner: ironbridge
      secret:
        name: ironbridge-db
      # PostgreSQL grants CONNECT and TEMPORARY to PUBLIC on new databases.
      # Revoke those defaults for the built-in databases and IronBridge.
      # Repeat the revocation when a later North Ops database is created.
      postInitSQL:
        - REVOKE CONNECT, TEMPORARY ON DATABASE postgres FROM PUBLIC
      postInitTemplateSQL:
        - REVOKE CONNECT, TEMPORARY ON DATABASE template1 FROM PUBLIC
      postInitApplicationSQL:
        - REVOKE CONNECT, TEMPORARY ON DATABASE ironbridge FROM PUBLIC
  monitoring:
    enablePodMonitor: true
  storage:
    size: 10Gi
    storageClass: openebs-hostpath
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: 128MB
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: northops-pg-rustfs-store
        serverName: northops-pg
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 2000m
      memory: 1Gi
