---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpoller
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: unpoller-secret
  data:
    - secretKey: UP_UNIFI_DEFAULT_API_KEY
      remoteRef:
        key: unpoller
        property: API_KEY
