---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: med-tracker-db
  namespace: home
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: med-tracker-db
    template:
      data:
        username: "med-tracker"
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: med-tracker-db
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: med-tracker-db-superuser
  namespace: home
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: med-tracker-db-superuser
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: "postgres"
        password: "{{ .superuser_password }}"
        DATABASE_URL: "postgresql://postgres:{{ .superuser_password | urlquery | replace \"+\" \"%20\" }}@med-tracker-rw.home.svc.cluster.local:5432/med-tracker"
  dataFrom:
    - extract:
        key: med-tracker-db
        property: superuser_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: med-tracker-db-runtime
  namespace: home
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: med-tracker-db-runtime
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: med_tracker_runtime
        password: "{{ .runtime_password }}"
        DATABASE_URL: "postgresql://med_tracker_runtime:{{ .runtime_password | urlquery | replace \"+\" \"%20\" }}@med-tracker-rw.home.svc.cluster.local:5432/med-tracker"
        AUTH_SESSION_SECRET: "{{ .AUTH_SESSION_SECRET }}"
        MEDTRACKER_SESSION_KEY: "{{ .MEDTRACKER_SESSION_KEY }}"
  dataFrom:
    - extract:
        key: med-tracker-db
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: med-tracker-db-update
  namespace: home
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: med-tracker-db-update
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: med_tracker_update
        password: "{{ .update_password }}"
        DATABASE_URL: "postgresql://med_tracker_update:{{ .update_password | urlquery | replace \"+\" \"%20\" }}@med-tracker-rw.home.svc.cluster.local:5432/med-tracker"
  data:
    - secretKey: update_password
      remoteRef:
        key: med-tracker-db
        property: update_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-cnpg-med-tracker
  namespace: home
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: rustfs-cnpg-med-tracker
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        ACCESS_KEY_ID: "{{ .username }}"
        SECRET_ACCESS_KEY: "{{ .password }}"
  dataFrom:
    - extract:
        key: rustfs-cnpg-med-tracker
