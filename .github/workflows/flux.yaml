---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "YAML, Flate & Mondoo"

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Relevant Changes
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    outputs:
      yaml: ${{ steps.filter.outputs.yaml }}
      kubernetes: ${{ steps.filter.outputs.kubernetes }}
      go: ${{ steps.filter.outputs.go }}
      mondoo: ${{ steps.filter.outputs.mondoo }}
      mqtt: ${{ steps.filter.outputs.mqtt }}
      redis: ${{ steps.filter.outputs.redis }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            yaml:
              - '**/*.yaml'
              - '**/*.yml'
              - '.yamllint*'
            kubernetes:
              - '.github/workflows/flux.yaml'
              - '.taskfiles/Flux/**'
              - 'kubernetes/**'
            go:
              - '.github/workflows/flux.yaml'
              - '.taskfiles/Kubernetes/Taskfile.yaml'
              - 'cmd/cluster-health/**'
              - 'internal/clusterhealth/**'
              - 'cmd/provisioning/**'
              - 'internal/provisioning/**'
              - '.mise/tasks/provisioning/**'
              - 'provisioning/**'
              - 'go.mod'
              - 'mise.lock'
              - 'mise.toml'
            mondoo:
              - '.github/workflows/flux.yaml'
              - 'kubernetes/**'
              - 'mondoo/**'
              - 'tests/test_metrics_ui_auth.py'
              - 'tests/test_redis_export.py'
              - 'scripts/mondoo_scan.py'
              - 'tests/test_zitadel_access_policy.rb'
              - 'tests/test_zitadel_config.py'
              - 'tests/test_gateway_api_source.py'
              - 'tests/test_loki_rule_watchers.py'
              - 'tests/test_loki_alerts.py'
              - 'tests/test_ksm_secret_access.py'
              - 'tests/test_ksm_ci.py'
            mqtt:
              - '.github/workflows/flux.yaml'
              - 'kubernetes/apps/home-automation/mosquitto/**'
              - 'tests/check_mqtt_acl.py'
            redis:
              - '.github/workflows/flux.yaml'
              - 'kubernetes/apps/database/redis/**'
              - 'kubernetes/apps/home-automation/paperless/app/**'
              - 'kubernetes/apps/home-automation/n8n/app/**'
              - 'kubernetes/apps/home/penpot/app/**'
              - 'tests/check_redis_access.py'
            contracts:
              - '.github/workflows/flux.yaml'
              - '.taskfiles/Kubernetes/Taskfile.yaml'
              - 'kubernetes/apps/home/med-tracker/**'
              - 'kubernetes/apps/monitoring/tempo/**'
              - 'kubernetes/apps/storage/rustfs-iam/**'
              - 'scripts/tempo_privacy_check.sh'
              - 'scripts/tempo_trace_backend_contract.sh'
              - 'tests/fixtures/tempo-privacy/**'
              - 'tests/mondoo/rustfs-iam.mql.yaml'

  yaml-lint:
    needs: changes
    if: ${{ needs.changes.outputs.yaml == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: Run yamllint
        uses: actionshub/yamllint@main

  yayamlls:
    name: Yayamlls
    needs: [changes, yaml-lint]
    if: >-
      ${{ always() && needs.changes.outputs.kubernetes == 'true' &&
      needs.yaml-lint.result != 'failure' &&
      needs.yaml-lint.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup yayamlls
        uses: home-operations/yayamlls/action@0.3.2
        with:
          token: ${{ github.token }}

      - name: Run yayamlls rendered validation
        run: yayamlls validate --render ./kubernetes

  mqtt-access:
    name: MQTT Access
    needs: changes
    if: ${{ needs.changes.outputs.mqtt == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify allowed and denied MQTT access
        run: python3 tests/check_mqtt_acl.py

  redis-access:
    name: Redis Access
    needs: changes
    if: ${{ needs.changes.outputs.redis == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Verify Redis authentication and persistence
        run: |
          python3 -m venv "$RUNNER_TEMP/redis-tests"
          "$RUNNER_TEMP/redis-tests/bin/pip" install PyYAML==6.0.3
          "$RUNNER_TEMP/redis-tests/bin/python" tests/check_redis_access.py

  cluster-health:
    name: Cluster Health CLI
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
          install: false
          cache: false

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/...

  mondoo:
    name: Mondoo
    needs: [changes, yaml-lint, yayamlls, flate-test]
    if: >-
      ${{ always() && needs.changes.outputs.mondoo == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '4.0.7'

      - name: Setup flate
        uses: home-operations/flate/action@v0.6.5
        with:
          base: ""
          token: ${{ github.token }}
          cache: "true"

      - name: Setup Workflow Tools
        run: |
          bash -c "$(curl -sSL https://install.mondoo.com/sh)"
          cnspec version

      - name: Run unit tests
        run: |
          python3 -m unittest tests/test_zitadel_config.py tests/test_traefik_gateway.py tests/test_gateway_api_source.py
          python3 -m unittest tests/test_kured_reboot_markers.py tests/test_system_upgrade_health_gate.py
          ruby tests/test_zitadel_access_policy.rb

      - name: Verify PR behaviour regressions
        run: |
          python3 -m venv "$RUNNER_TEMP/behaviour-tests"
          "$RUNNER_TEMP/behaviour-tests/bin/pip" install PyYAML==6.0.3
          "$RUNNER_TEMP/behaviour-tests/bin/python" -m unittest tests/test_paperless_backup.py tests/test_redis_export.py

      - name: Lint Mondoo policies
        run: cnspec policy lint mondoo/policies/*.mql.yaml

      - name: Setup Helm for monitoring and KSM regressions
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.0

      - name: Verify both rendered Loki watchers
        env:
          LOKI_CHARTS_PATH: ${{ runner.temp }}/loki-charts
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/loki-test-env"
          "$RUNNER_TEMP/loki-test-env/bin/pip" install 'PyYAML==6.0.3'
          loki_version=$("$RUNNER_TEMP/loki-test-env/bin/python" -c 'import yaml; print(next(d for d in yaml.safe_load_all(open("kubernetes/apps/monitoring/loki/app/helmrelease.yaml")) if d["kind"] == "OCIRepository")["spec"]["ref"]["tag"])')
          openebs_version=$("$RUNNER_TEMP/loki-test-env/bin/python" -c 'import yaml; print(yaml.safe_load(open("kubernetes/apps/openebs-system/openebs/app/helmrelease.yaml"))["spec"]["chart"]["spec"]["version"])')
          mkdir -p "$LOKI_CHARTS_PATH"
          helm pull oci://ghcr.io/grafana/helm-charts/loki --version "$loki_version" --untar --untardir "$LOKI_CHARTS_PATH"
          helm pull openebs --repo https://openebs.github.io/openebs --version "$openebs_version" --untar --untardir "$LOKI_CHARTS_PATH"
          "$RUNNER_TEMP/loki-test-env/bin/python" -m unittest tests/test_loki_rule_watchers.py tests/test_loki_alerts.py

      - name: Verify rendered maintenance safety
        env:
          MAINTENANCE_CHARTS_PATH: ${{ runner.temp }}/maintenance-charts
        run: |
          set -euo pipefail
          mkdir -p "$MAINTENANCE_CHARTS_PATH"
          for entry in kube-system/kured storage/longhorn; do
            name=${entry##*/}
            release="kubernetes/apps/$entry/app/helmrelease.yaml"
            if [ "$name" = longhorn ]; then release="kubernetes/apps/$entry/app/HelmRelease.yaml"; fi
            chart_version=$(yq '.spec.chart.spec.version' "$release")
            repo=$(yq '.spec.url' "kubernetes/flux/repositories/helm/$name.yaml")
            helm pull "$name" --repo "$repo" --version "$chart_version" --untar --untardir "$MAINTENANCE_CHARTS_PATH"
          done
          python3 -m unittest tests/test_maintenance_charts.py

      - name: Verify rendered KSM permissions
        env:
          VM_STACK_CHART_PATH: ${{ runner.temp }}/ksm-charts/victoria-metrics-k8s-stack
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ksm-test-env"
          "$RUNNER_TEMP/ksm-test-env/bin/pip" install 'PyYAML==6.0.3'
          chart_version=$("$RUNNER_TEMP/ksm-test-env/bin/python" -c 'import yaml; print(yaml.safe_load(open("kubernetes/apps/monitoring/victoria-metrics/app/helmrelease.yaml"))["spec"]["chart"]["spec"]["version"])')
          mkdir -p "$RUNNER_TEMP/ksm-charts"
          helm pull victoria-metrics-k8s-stack --repo https://victoriametrics.github.io/helm-charts --version "$chart_version" --untar --untardir "$RUNNER_TEMP/ksm-charts"
          "$RUNNER_TEMP/ksm-test-env/bin/python" -m unittest tests/test_ksm_secret_access.py tests/test_ksm_ci.py

      - name: Run rendered manifest scans
        env:
          FLATE_BASE: ""
        run: >-
          python3 scripts/mondoo_scan.py
          --output junit
          --report-dir mondoo-reports
          k8s-manifests --path ./kubernetes --include-posture

      - name: Verify authenticated metrics access
        run: |
          python3 -m venv "$RUNNER_TEMP/metrics-test-env"
          "$RUNNER_TEMP/metrics-test-env/bin/pip" install PyYAML==6.0.3
          "$RUNNER_TEMP/metrics-test-env/bin/python" -m unittest tests/test_metrics_ui_auth.py

      - name: Upload Mondoo reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mondoo-reports
          path: mondoo-reports
          if-no-files-found: ignore

  rustfs-iam-policy:
    name: RustFS IAM Policy
    needs: [changes, yaml-lint]
    if: >-
      ${{ always() && needs.changes.outputs.contracts == 'true' &&
      needs.yaml-lint.result != 'failure' &&
      needs.yaml-lint.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ github.token }}

      - name: Setup Workflow Tools
        run: |
          bash -c "$(curl -sSL https://install.mondoo.com/sh)"
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ripgrep
          cnspec providers install os

      - name: Run RustFS IAM policy
        run: task k8s:rustfs-iam-policy

      - name: Run Tempo trace backend contract
        run: task k8s:tempo-trace-backend-contract

  flate-test:
    name: Flate Test
    needs: [changes, yaml-lint, yayamlls, rustfs-iam-policy]
    if: >-
      ${{ always() && needs.changes.outputs.kubernetes == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup flate
        uses: home-operations/flate/action@v0.6.5
        with:
          base: ""
          token: ${{ github.token }}
          cache: "true"

      - name: Run flate test
        env:
          FLATE_BASE: ""
        run: >-
          flate --no-progress test all
          --api-versions "policy/v1/PodDisruptionBudget,monitoring.coreos.com/v1,monitoring.coreos.com/v1/ServiceMonitor,monitoring.coreos.com/v1/PodMonitor,monitoring.coreos.com/v1/PrometheusRule"
          --path ./kubernetes

  flate-diff:
    name: Flate Diff
    needs: [changes, yaml-lint, yayamlls, rustfs-iam-policy]
    if: >-
      ${{ always() && needs.changes.outputs.kubernetes == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup flate
        uses: home-operations/flate/action@v0.6.5
        with:
          base: ""
          token: ${{ github.token }}
          cache: "true"

      - name: Fetch PR Base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "+${BASE_SHA}:refs/remotes/origin/pr-base"
          git rev-parse --verify "refs/remotes/origin/pr-base^{commit}"

      - name: Run flate diff
        id: diff
        shell: bash
        env:
          FLATE_BASE: origin/pr-base
        run: |
          set -euo pipefail
          flate --no-progress diff all \
            --api-versions "policy/v1/PodDisruptionBudget,monitoring.coreos.com/v1,monitoring.coreos.com/v1/ServiceMonitor,monitoring.coreos.com/v1/PodMonitor,monitoring.coreos.com/v1/PrometheusRule" \
            --path ./kubernetes \
            -o github > flate.diff
          if [[ -s flate.diff ]]; then
            {
              echo '`````diff'
              cat flate.diff
              echo '`````'
            } > flate-comment.md
            echo 'has_diff=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_diff=false' >> "$GITHUB_OUTPUT"
          fi

      - name: PR Comment
        uses: mshick/add-pr-comment@v3
        if: ${{ steps.diff.outputs.has_diff == 'true' }}
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          message-failure: Unable to post flate diff
          message-path: flate-comment.md

  flate-success:
    if: ${{ always() }}
    needs: ["changes", "flate-diff", "flate-test", "mondoo", "rustfs-iam-policy", "mqtt-access", "redis-access"]
    name: Flate Successful
    runs-on: ubuntu-slim
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        name: Check matrix status
        run: exit 1
