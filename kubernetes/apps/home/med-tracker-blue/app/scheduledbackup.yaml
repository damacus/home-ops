---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: med-tracker-blue
  namespace: home
spec:
  schedule: "0 50 3 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  target: primary
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      objectStore: med-tracker-blue-rustfs-store
  cluster:
    name: med-tracker-blue
