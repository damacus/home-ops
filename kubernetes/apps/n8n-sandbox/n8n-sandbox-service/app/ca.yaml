---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: n8n-sandbox-ca
spec:
  commonName: n8n-sandbox-ca
  duration: 8760h
  renewBefore: 720h
  isCA: true
  secretName: n8n-sandbox-ca-tls
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: selfsigned-issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: n8n-sandbox-ca
spec:
  ca:
    secretName: n8n-sandbox-ca-tls
