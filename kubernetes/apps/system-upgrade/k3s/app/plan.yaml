---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: controllers
spec:
  # renovate: depName=k3s-io/k3s datasource=github-releases versioning=semver-coerced
  version: v1.37.0+k3s1
  upgrade:
    image: rancher/k3s-upgrade
  serviceAccountName: system-upgrade
  concurrency: 1
  # Keep the health gate alive until the VIP and control plane recover.
  jobActiveDeadlineSecs: 0
  cordon: true
  prepare:
    image: rancher/k3s-upgrade
    command: ["/bin/sh", "-ec"]
    args:
      - |
        export KUBERNETES_SERVICE_HOST=192.168.1.220
        export KUBERNETES_SERVICE_PORT=6443
        K3S_BIN="${K3S_BIN:-/opt/k3s}"
        SLEEP_BIN="${SLEEP_BIN:-sleep}"
        while true; do
          if "$K3S_BIN" kubectl --request-timeout=5s get --raw=/readyz >/dev/null 2>&1 &&
             nodes_json="$("$K3S_BIN" kubectl --request-timeout=5s get nodes --selector=node-role.kubernetes.io/control-plane -o json)" &&
             [ -n "$nodes_json" ] &&
             printf '%s\n' "$nodes_json" |
               jq -e '(.items | length) >= 3 and all(.items[]; any(.status.conditions[]; .type == "Ready" and .status == "True"))' >/dev/null 2>&1; then
            echo "API VIP is ready and all control-plane nodes are Ready"
            exit 0
          fi
          echo "Waiting for API VIP readiness and all control-plane nodes to become Ready"
          "$SLEEP_BIN" 10
        done
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
  tolerations:
    - effect: NoSchedule
      operator: Exists
    - effect: NoExecute
      operator: Exists
    - key: node-role.kubernetes.io/control-plane
      effect: NoSchedule
      operator: Exists
    - key: node-role.kubernetes.io/master
      effect: NoSchedule
      operator: Exists
    - key: node-role.kubernetes.io/etcd
      effect: NoExecute
      operator: Exists
    - key: CriticalAddonsOnly
      operator: Exists
---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: workers
spec:
  serviceAccountName: system-upgrade
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  prepare:
    image: rancher/k3s-upgrade
    args: ["prepare", "controllers"]
  upgrade:
    image: rancher/k3s-upgrade
  # renovate: depName=k3s-io/k3s datasource=github-releases versioning=semver-coerced
  version: v1.37.0+k3s1
