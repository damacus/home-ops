---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-mcp
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: grafana-mcp
  data:
    - secretKey: GRAFANA_SERVICE_ACCOUNT_TOKEN
      remoteRef:
        key: litellm
        property: grafana-service-account-token
    - secretKey: MCP_GRAFANA_SERVER_TOKEN
      remoteRef:
        key: litellm
        property: grafana-mcp-token
