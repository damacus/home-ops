---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpoller
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      unpoller:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
        containers:
          app:
            image:
              repository: ghcr.io/unpoller/unpoller
              tag: v5.2.7
            envFrom:
              - secretRef:
                  name: unpoller-secret
            env:
              UP_UNIFI_DEFAULT_URL: https://unifi.ironstone.casa
              UP_UNIFI_DEFAULT_VERIFY_SSL: "true"
              UP_UNIFI_DEFAULT_TIMEOUT: 15s
              UP_UNIFI_DEFAULT_SAVE_SITES: "false"
              UP_UNIFI_DEFAULT_SAVE_DPI: "false"
              UP_UNIFI_DEFAULT_SAVE_TRAFFIC: "false"
              UP_UNIFI_DEFAULT_SAVE_EVENTS: "false"
              UP_UNIFI_DEFAULT_SAVE_ALARMS: "false"
              UP_UNIFI_DEFAULT_SAVE_ANOMALIES: "false"
              UP_UNIFI_DEFAULT_SAVE_IDS: "false"
              UP_UNIFI_DEFAULT_SAVE_SYSLOG: "false"
              UP_UNIFI_DEFAULT_SAVE_ROGUE: "false"
              UP_UNIFI_DEFAULT_SAVE_PROTECT_DEVICES: "false"
              UP_INFLUXDB_DISABLE: "true"
              UP_PROMETHEUS_NAMESPACE: unpoller
              UP_PROMETHEUS_HTTP_LISTEN: 0.0.0.0:9130
              UP_PROMETHEUS_INTERVAL: 30s
              UP_PROMETHEUS_REPORT_ERRORS: "true"
              UP_POLLER_QUIET: "true"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            probes:
              liveness:
                enabled: true
                type: TCP
              readiness:
                enabled: true
                type: TCP
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: unpoller
        labels:
          app.kubernetes.io/name: unpoller
        ports:
          http:
            port: 9130
