---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "YAML, Flate & Mondoo"

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Relevant Changes
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    outputs:
      yaml: ${{ steps.filter.outputs.yaml }}
      kubernetes: ${{ steps.filter.outputs.kubernetes }}
      go: ${{ steps.filter.outputs.go }}
      mondoo: ${{ steps.filter.outputs.mondoo }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            yaml:
              - '**/*.yaml'
              - '**/*.yml'
              - '.yamllint*'
            kubernetes:
              - '.github/workflows/flux.yaml'
              - '.taskfiles/Flux/**'
              - 'kubernetes/**'
            go:
              - '.github/workflows/flux.yaml'
              - '.taskfiles/Kubernetes/Taskfile.yaml'
              - 'cmd/cluster-health/**'
              - 'internal/clusterhealth/**'
              - 'cmd/provisioning/**'
              - 'internal/provisioning/**'
              - '.mise/tasks/provisioning/**'
              - 'provisioning/**'
              - 'go.mod'
              - 'mise.lock'
              - 'mise.toml'
            mondoo:
              - '.github/workflows/flux.yaml'
              - 'kubernetes/**'
              - 'mondoo/**'
              - 'scripts/mondoo_scan.py'
              - 'tests/test_mondoo_scan.py'
              - 'tests/test_paperless_v3_config.py'
              - 'tests/test_zitadel_access_policy.rb'
              - 'tests/test_zitadel_config.py'
            contracts:
              - '.github/workflows/flux.yaml'
              - '.taskfiles/Kubernetes/Taskfile.yaml'
              - 'kubernetes/apps/authentication/zitadel-db/**'
              - 'kubernetes/apps/dev/forgejo-db/**'
              - 'kubernetes/apps/home-automation/home-assistant-db/**'
              - 'kubernetes/apps/home-automation/n8n-db/**'
              - 'kubernetes/apps/home-automation/paperless/**'
              - 'kubernetes/apps/home/immich-db/**'
              - 'kubernetes/apps/home/mealie-db/**'
              - 'kubernetes/apps/home/med-tracker*/**'
              - 'kubernetes/apps/home/penpot-db/**'
              - 'kubernetes/apps/monitoring/grafana/**'
              - 'kubernetes/apps/monitoring/kustomization.yaml'
              - 'kubernetes/apps/monitoring/loki/**'
              - 'kubernetes/apps/monitoring/tempo/**'
              - 'kubernetes/apps/storage/kustomization.yaml'
              - 'kubernetes/apps/storage/longhorn/**'
              - 'kubernetes/apps/storage/rustfs*/**'
              - 'scripts/tempo_privacy_check.sh'
              - 'scripts/tempo_trace_backend_contract.sh'
              - 'tests/fixtures/tempo-privacy/**'
              - 'tests/mondoo/rustfs-iam.mql.yaml'

  yaml-lint:
    needs: changes
    if: ${{ needs.changes.outputs.yaml == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: Run yamllint
        uses: actionshub/yamllint@main

  yayamlls:
    name: Yayamlls
    needs: [changes, yaml-lint]
    if: >-
      ${{ always() && needs.changes.outputs.kubernetes == 'true' &&
      needs.yaml-lint.result != 'failure' &&
      needs.yaml-lint.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup yayamlls
        uses: home-operations/yayamlls/action@0.2.0
        with:
          token: ${{ github.token }}

      - name: Run yayamlls rendered validation
        run: yayamlls validate --render ./kubernetes

  cluster-health:
    name: Cluster Health CLI
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.8
          install: false
          cache: false

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/...

  mondoo:
    name: Mondoo
    needs: [changes, yaml-lint, yayamlls, flate-test]
    if: >-
      ${{ always() && needs.changes.outputs.mondoo == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '4.0'

      - name: Setup flate
        uses: home-operations/flate/action@v0.6.1
        with:
          base: ""
          token: ${{ github.token }}
          cache: "true"

      - name: Setup Workflow Tools
        run: |
          bash -c "$(curl -sSL https://install.mondoo.com/sh)"
          cnspec version

      - name: Run unit tests
        run: |
          python3 -m unittest tests/test_mondoo_scan.py tests/test_paperless_v3_config.py tests/test_zitadel_config.py
          ruby tests/test_zitadel_access_policy.rb

      - name: Validate migrated policy parity
        run: python3 scripts/mondoo_scan.py validate-parity

      - name: Lint Mondoo policies
        run: cnspec policy lint mondoo/policies/*.mql.yaml

      - name: Run rendered manifest scans
        env:
          FLATE_BASE: ""
        run: >-
          python3 scripts/mondoo_scan.py
          --output junit
          --report-dir mondoo-reports
          k8s-manifests --path ./kubernetes --include-posture

      - name: Upload Mondoo reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mondoo-reports
          path: mondoo-reports
          if-no-files-found: ignore

  rustfs-iam-policy:
    name: RustFS IAM Policy
    needs: [changes, yaml-lint]
    if: >-
      ${{ always() && needs.changes.outputs.contracts == 'true' &&
      needs.yaml-lint.result != 'failure' &&
      needs.yaml-lint.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ github.token }}

      - name: Setup Workflow Tools
        run: |
          bash -c "$(curl -sSL https://install.mondoo.com/sh)"
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ripgrep
          cnspec providers install os

      - name: Run RustFS IAM policy
        run: task k8s:rustfs-iam-policy

      - name: Run Tempo trace backend contract
        run: task k8s:tempo-trace-backend-contract

  flate-test:
    name: Flate Test
    needs: [changes, yaml-lint, yayamlls, rustfs-iam-policy]
    if: >-
      ${{ always() && needs.changes.outputs.kubernetes == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup flate
        uses: home-operations/flate/action@v0.6.1
        with:
          base: ""
          token: ${{ github.token }}
          cache: "true"

      - name: Run flate test
        env:
          FLATE_BASE: ""
        run: >-
          flate --no-progress test all
          --api-versions "policy/v1/PodDisruptionBudget,monitoring.coreos.com/v1,monitoring.coreos.com/v1/ServiceMonitor,monitoring.coreos.com/v1/PodMonitor,monitoring.coreos.com/v1/PrometheusRule"
          --path ./kubernetes

  flate-diff:
    name: Flate Diff
    needs: [changes, yaml-lint, yayamlls, rustfs-iam-policy]
    if: >-
      ${{ always() && needs.changes.outputs.kubernetes == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup flate
        uses: home-operations/flate/action@v0.6.1
        with:
          base: ""
          token: ${{ github.token }}
          cache: "true"

      - name: Fetch PR Base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "+${BASE_SHA}:refs/remotes/origin/pr-base"
          git rev-parse --verify "refs/remotes/origin/pr-base^{commit}"

      - name: Run flate diff
        id: diff
        shell: bash
        env:
          FLATE_BASE: origin/pr-base
        run: |
          set -euo pipefail
          flate --no-progress diff all \
            --api-versions "policy/v1/PodDisruptionBudget,monitoring.coreos.com/v1,monitoring.coreos.com/v1/ServiceMonitor,monitoring.coreos.com/v1/PodMonitor,monitoring.coreos.com/v1/PrometheusRule" \
            --path ./kubernetes \
            -o github > flate.diff
          if [[ -s flate.diff ]]; then
            {
              echo '`````diff'
              cat flate.diff
              echo '`````'
            } > flate-comment.md
            echo 'has_diff=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_diff=false' >> "$GITHUB_OUTPUT"
          fi

      - name: PR Comment
        uses: mshick/add-pr-comment@v3
        if: ${{ steps.diff.outputs.has_diff == 'true' }}
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          message-failure: Unable to post flate diff
          message-path: flate-comment.md

  flate-success:
    if: ${{ always() }}
    needs: ["changes", "flate-diff", "flate-test", "mondoo", "rustfs-iam-policy"]
    name: Flate Successful
    runs-on: ubuntu-slim
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        name: Check matrix status
        run: exit 1
