---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scrypted-mcp
  namespace: home-automation
spec:
  hostnames: [scrypted.ironstone.casa]
  parentRefs:
    - name: traefik-internal
      namespace: network
      sectionName: websecure
  rules:
    # This plugin enforces OAuth itself; browser SSO cannot authenticate MCP clients.
    # The management console retains its separate SSO-protected route.
    - matches:
        - path:
            type: PathPrefix
            value: /endpoint/scrypted-mcp/public
      backendRefs:
        - name: scrypted
          port: 10443
