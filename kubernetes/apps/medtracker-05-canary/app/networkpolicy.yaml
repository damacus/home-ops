---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: dns}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: application}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/part-of: medtracker-05}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {cnpg.io/cluster: medtracker-05}
      ports:
        - {port: 5432, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: server}
spec:
  podSelector:
    matchLabels: {app: medtracker-05}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: network}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports:
        - {port: 80, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: database}
spec:
  podSelector:
    matchLabels: {cnpg.io/cluster: medtracker-05}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/part-of: medtracker-05}
      ports:
        - {port: 5432, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: database}
          podSelector:
            matchLabels: {app.kubernetes.io/name: cloudnative-pg, app.kubernetes.io/instance: cloudnative-pg}
        - podSelector:
            matchLabels: {cnpg.io/cluster: medtracker-05}
      ports:
        - {port: 8000, protocol: TCP}
        - {port: 5432, protocol: TCP}
  egress:
    - to:
        - podSelector:
            matchLabels: {cnpg.io/cluster: medtracker-05}
      ports:
        - {port: 8000, protocol: TCP}
        - {port: 5432, protocol: TCP}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: database-api}
spec:
  endpointSelector:
    matchLabels: {cnpg.io/cluster: medtracker-05}
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - {port: '443', protocol: TCP}
            - {port: '6443', protocol: TCP}
