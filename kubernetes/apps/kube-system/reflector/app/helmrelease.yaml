---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: emberstack
spec:
  interval: 1h
  url: oci://ghcr.io/emberstack/helm-charts/reflector
  ref:
    tag: 10.0.78
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: emberstack
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # canary: Rust re-implementation (k8s-reflector-rs)
    image:
      repository: ghcr.io/damacus/k8s-reflecto-rs
      tag: 0.1.5@sha256:c7ffe6f57360a90821452276caca995323653c1f7d9639ce198cb655d15fd652
    imagePullSecrets:
      - name: dockerhub-credentials
