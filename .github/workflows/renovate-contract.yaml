---
name: Renovate image contract

on:
  pull_request:
    paths:
      - .github/renovate.json5
      - .github/workflows/renovate-contract.yaml
      - tests/check_release_mirror.mjs
      - kubernetes/apps/dev/ironbridge/**
      - kubernetes/apps/dev/northbot/**
      - kubernetes/apps/home/ledger/**
      - kubernetes/apps/home/med-tracker/**
      - kubernetes/apps/default/unifi-release-announcer/**
      - kubernetes/apps/kube-system/reflector/**
      - kubernetes/apps/medtracker-canary/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install the contract's Renovate engine
        run: npm install --prefix "$RUNNER_TEMP/renovate" --ignore-scripts --no-audit --no-fund renovate@44.222.5
      - name: Validate repository configuration
        run: |
          "$RUNNER_TEMP/renovate/node_modules/.bin/renovate-config-validator" --strict .github/renovate.json5
      - name: Verify extraction, catalogue lookups and manifest replacement
        run: node tests/check_release_mirror.mjs --renovate-dir "$RUNNER_TEMP/renovate/node_modules/renovate"
