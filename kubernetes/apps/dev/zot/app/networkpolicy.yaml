---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zot
  namespace: dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: zot
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - port: 5000
      protocol: TCP
    from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: cinc-registry
