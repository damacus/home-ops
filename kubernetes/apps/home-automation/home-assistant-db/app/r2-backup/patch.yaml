---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: physical-backup
spec:
  schedule: 25 1 * * *
  suspend: false
  jobTemplate:
    spec:
      template:
        spec:
          initContainers:
          - name: basebackup
            env:
            - name: PGHOST
              value: home-assistant-green-rw.home-automation.svc.cluster.local
            resources:
              limits:
                ephemeral-storage: 68Gi
          containers:
          - name: upload
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: home-assistant-green-r2-credentials
                  key: aws-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: home-assistant-green-r2-credentials
                  key: aws-secret-access-key
            - name: BACKUP_PREFIX
              value: physical/home-automation/home-assistant-green/
          volumes:
          - name: work
            emptyDir:
              sizeLimit: 68Gi
          - name: ca
            secret:
              secretName: home-assistant-green-ca
              items:
              - key: ca.crt
                path: ca.crt
          - name: client
            secret:
              secretName: home-assistant-green-replication
              defaultMode: 288
              items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
