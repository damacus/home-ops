schema: spec-driven

context: |
  home-ops is the production Infrastructure-as-Code repository for a k3s cluster.
  Flux HelmRelease and Kustomization resources under kubernetes/ are the source of truth.
  Reuse existing Grafana, Loki, VictoriaMetrics, RustFS, ExternalSecret, Cilium
  NetworkPolicy, OCIRepository, and Mise task patterns. Never commit credentials,
  rendered secrets, health data, or trace payloads. Start from fresh origin/main,
  use Mise commands for validation, and require live Flux and cluster evidence for
  deployment completion.

rules:
  proposal:
    - State the originating issue, scope, affected systems, and explicit non-goals.
  specs:
    - Express requirements as testable GIVEN, WHEN, and THEN scenarios.
    - Cover private networking, least-privilege secrets, rollback, and bounded retention where relevant.
  design:
    - Record rejected alternatives, dependency order, GitOps rollout, and rollback.
  tasks:
    - Use failing contract validation before manifest implementation.
    - Bound every change and route discovered platform expansion into a separate change.

operations:
  apply:
    guidance:
      - Read AGENTS.md and GEMINI.md before implementation.
      - Work in a dedicated branch and use Mise commands for repository verification.
      - Stage production changes through an isolated canary and preserve fail-open application behavior.
  archive:
    guidance:
      - Archive only after the exact deployed revisions pass their finite production checks.
