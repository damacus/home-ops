---
name: MedTracker canary reset image
on:
  pull_request:
    paths:
      - cmd/medtracker-canary-reset/**
      - internal/medtrackercanary/**
      - go.mod
      - go.sum
      - .github/workflows/medtracker-canary-reset.yaml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested reset runner from main
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      CANARY_DISPOSABLE_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./internal/medtrackercanary ./cmd/medtracker-canary-reset
      - run: go vet ./internal/medtrackercanary ./cmd/medtracker-canary-reset
  image:
    needs: test
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build native static executable
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o dist/medtracker-canary-reset ./cmd/medtracker-canary-reset
      - name: Build and check container rejects missing configuration
        run: |
          docker build -f cmd/medtracker-canary-reset/Dockerfile -t canary-reset:checked .
          if docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges canary-reset:checked > rejected.log 2>&1; then
            echo "Unconfigured reset unexpectedly succeeded" >&2
            exit 1
          fi
          grep -F "SEED_ARGS must select" rejected.log
          docker save canary-reset:checked > image.tar
          sha256sum image.tar > image.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: canary-reset-${{ matrix.arch }}
          path: |
            image.tar
            image.sha256
          retention-days: 1
  publish:
    if: github.repository == 'damacus/home-ops' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    needs: image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: canary-reset-*
          path: checked
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish checked images
        env:
          IMAGE: ghcr.io/damacus/home-ops-medtracker-canary-reset
          REVISION: ${{ github.sha }}
        run: |
          for arch in amd64 arm64; do
            (cd "checked/canary-reset-$arch" && sha256sum --check image.sha256)
            docker load --input "checked/canary-reset-$arch/image.tar"
            test "$(docker inspect canary-reset:checked --format '{{.Architecture}}')" = "$arch"
            docker tag canary-reset:checked "$IMAGE:sha-$REVISION-$arch"
            docker push "$IMAGE:sha-$REVISION-$arch"
          done
          docker manifest create "$IMAGE:sha-$REVISION" "$IMAGE:sha-$REVISION-amd64" "$IMAGE:sha-$REVISION-arm64"
          docker manifest push "$IMAGE:sha-$REVISION"
