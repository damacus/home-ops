---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cinc-registry-config
  namespace: flux-system
spec:
  targetNamespace: dev
  path: "./kubernetes/apps/dev/supermarket/config"
  prune: true
  wait: true
  dependsOn:
  - name: cinc-registry-db
  - name: external-secrets-stores
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  interval: 30m
  retryInterval: 1m
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cinc-registry-bootstrap
  namespace: flux-system
spec:
  targetNamespace: dev
  path: "./kubernetes/apps/dev/supermarket/bootstrap"
  prune: true
  wait: true
  dependsOn:
  - name: cinc-registry-config
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  force: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cinc-registry
  namespace: flux-system
spec:
  targetNamespace: dev
  path: "./kubernetes/apps/dev/supermarket/app"
  prune: true
  wait: true
  dependsOn:
  - name: cinc-registry-bootstrap
  - name: zot
  - name: traefik
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  interval: 30m
  retryInterval: 1m
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cinc-registry-import
  namespace: flux-system
spec:
  targetNamespace: dev
  path: "./kubernetes/apps/dev/supermarket/import"
  prune: true
  wait: true
  dependsOn:
  - name: cinc-registry
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  interval: 30m
  retryInterval: 1m
  timeout: 10m
