---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: northops-postgres-rustfs-store
  namespace: dev
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://cnpg-northops-postgres/
    endpointURL: http://rustfs.storage.svc.cluster.local:9000
    s3Credentials:
      accessKeyId:
        name: rustfs-cnpg-northops-postgres
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: rustfs-cnpg-northops-postgres
        key: SECRET_ACCESS_KEY
    data:
      compression: bzip2
    wal:
      compression: bzip2
      maxParallel: 2
