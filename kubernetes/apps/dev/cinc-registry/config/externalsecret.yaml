---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cinc-registry-runtime
  namespace: dev
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cinc-registry-runtime
    template:
      engineVersion: v2
      data:
        CINC_SM_DATABASE_URL: postgres://cinc_sm_runtime:{{ .db_password | urlquery
          }}@cinc-registry-rw.dev.svc.cluster.local:5432/cinc_supermarket?sslmode=require
        CINC_SM_ARTIFACT_STORE_ACCESS_KEY_ID: "{{ .access_key }}"
        CINC_SM_ARTIFACT_STORE_SECRET_ACCESS_KEY: "{{ .secret_key }}"
        CINC_SM_PUBLISH_TOKEN_SIGNING_KEY: "{{ .signing_key }}"
  data:
  - secretKey: db_password
    remoteRef:
      key: cinc-registry-db-runtime
      property: password
  - secretKey: access_key
    remoteRef:
      key: rustfs-cinc-registry-artifacts
      property: username
  - secretKey: secret_key
    remoteRef:
      key: rustfs-cinc-registry-artifacts
      property: password
  - secretKey: signing_key
    remoteRef:
      key: cinc-registry-oci-signing
      property: signing_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cinc-registry-migrate
  namespace: dev
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cinc-registry-migrate
    template:
      engineVersion: v2
      data:
        CINC_SM_MIGRATION_DATABASE_URL: postgres://cinc_sm_owner:{{ .password | urlquery
          }}@cinc-registry-rw.dev.svc.cluster.local:5432/cinc_supermarket?sslmode=require
  data:
  - secretKey: password
    remoteRef:
      key: cinc-registry-db-owner
      property: password
