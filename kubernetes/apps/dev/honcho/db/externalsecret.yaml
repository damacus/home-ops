---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: honcho-db-owner
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: honcho-db-owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: 'true'
      data:
        username: honcho
        password: '{{ .password }}'
        DB_CONNECTION_URI: postgresql+psycopg://honcho:{{ .password | urlquery | replace "+" "%20" }}@honcho-db-rw:5432/honcho?sslmode=require
  data:
    - secretKey: password
      remoteRef:
        key: honcho-db
        property: password
