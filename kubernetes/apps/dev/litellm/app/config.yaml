---
model_list:
  - model_name: "*"
    litellm_params:
      model: openai/*
      api_key: os.environ/OPENAI_API_KEY
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
litellm_settings:
  set_verbose: false
  turn_off_message_logging: true
  success_callback:
    - prometheus
  failure_callback:
    - prometheus
  request_timeout: 120
  num_retries: 1
mcp_servers:
  home_assistant:
    url: https://home-assistant.damacus.io/api/mcp
    transport: http
    auth_type: bearer_token
    auth_value: os.environ/HOME_ASSISTANT_TOKEN
    allow_all_keys: false
  grafana:
    url: http://grafana-mcp.monitoring.svc.cluster.local:8000/mcp
    transport: http
    auth_type: bearer_token
    auth_value: os.environ/GRAFANA_MCP_TOKEN
    allow_all_keys: false
