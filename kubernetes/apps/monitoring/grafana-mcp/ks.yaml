---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-mcp
  namespace: flux-system
spec:
  suspend: true
  targetNamespace: monitoring
  path: ./kubernetes/apps/monitoring/grafana-mcp/app
  prune: true
  dependsOn:
    - name: grafana
    - name: external-secrets-stores
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
