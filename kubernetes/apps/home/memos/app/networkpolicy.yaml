---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: memos
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/controller: memos
      app.kubernetes.io/instance: memos
      app.kubernetes.io/name: memos
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
          podSelector:
            matchLabels:
              app.kubernetes.io/component: interceptor
              app.kubernetes.io/instance: keda-http-add-on
      ports:
        - port: 5230
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 5230
