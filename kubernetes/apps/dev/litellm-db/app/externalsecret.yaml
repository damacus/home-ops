---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-db-owner
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: litellm-db-owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: 'true'
      data:
        username: litellm
        password: '{{ .password }}'
        DATABASE_URL: postgresql://litellm:{{ .password | urlquery | replace "+" "%20" }}@litellm-db-rw.dev.svc.cluster.local:5432/litellm?sslmode=require
  data:
    - secretKey: password
      remoteRef:
        key: litellm-db
        property: password
