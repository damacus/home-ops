---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: northbot
  namespace: dev
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: northbot
    creationPolicy: Owner
  data:
    - secretKey: SLACK_BOT_TOKEN
      remoteRef: {key: northbot, property: SLACK_BOT_TOKEN}
    - secretKey: SLACK_APP_TOKEN
      remoteRef: {key: northbot, property: SLACK_APP_TOKEN}
    - secretKey: SLACK_TEAM_ID
      remoteRef: {key: northbot, property: SLACK_TEAM_ID}
    - secretKey: SLACK_WORKSPACE_URL
      remoteRef: {key: northbot, property: SLACK_WORKSPACE_URL}
    - secretKey: REVIEW_CHANNEL_ID
      remoteRef: {key: northbot, property: REVIEW_CHANNEL_ID}
    - secretKey: REPORT_CHANNEL_IDS
      remoteRef: {key: northbot, property: REPORT_CHANNEL_IDS}
    - secretKey: ADMIN_USER_IDS
      remoteRef: {key: northbot, property: ADMIN_USER_IDS}
    - secretKey: JEV_API_KEY
      remoteRef: {key: JEV_API_KEY, property: credential}
