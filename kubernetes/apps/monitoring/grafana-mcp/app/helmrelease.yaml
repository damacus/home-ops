---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-mcp
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      grafana-mcp:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            image:
              repository: grafana/mcp-grafana
              tag: 2.2.0@sha256:697336440e34878f8e0b26a69675db8d7e97b4d0daec25ec5441c85ac6c60e81
            args:
              - -t
              - streamable-http
              - --address
              - 0.0.0.0:8000
              - --allowed-hosts
              - grafana-mcp.monitoring.svc.cluster.local:8000
              - --disable-write
            env:
              GRAFANA_URL: http://grafana.monitoring.svc.cluster.local
              GRAFANA_USAGE_STATS: 'false'
            envFrom:
              - secretRef:
                  name: grafana-mcp
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            probes:
              startup:
                enabled: true
                type: TCP
              readiness:
                enabled: true
                type: TCP
              liveness:
                enabled: true
                type: TCP
    defaultPodOptions:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-credentials
    service:
      app:
        controller: grafana-mcp
        ports:
          http:
            port: 8000
