---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scrypted
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: scrypted-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        reolink-host: "192.168.1.17"
        reolink-username: admin
        reolink-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        # Item UUID: 4udyqvco4rgul7w57whrdho6fy. Connect resolves item titles.
        key: Reolink
        property: ONVIF
