---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: med-tracker-blue
  namespace: home
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  imagePullSecrets:
    - name: ghcr-credentials
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: 18
  instances: 2
  primaryUpdateStrategy: unsupervised
  managed:
    roles:
      - name: med_tracker_app
        ensure: present
        login: false
        superuser: false
        bypassrls: false
      - name: med_tracker_runtime
        ensure: present
        login: true
        inherit: true
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        inRoles:
          - med_tracker_app
        passwordSecret:
          name: med-tracker-blue-runtime
  storage:
    size: 5Gi
    storageClass: openebs-hostpath
  monitoring:
    enablePodMonitor: true
  bootstrap:
    initdb:
      database: medtracker
      owner: med_tracker_bootstrap
  enableSuperuserAccess: true
  superuserSecret:
    name: med-tracker-blue-superuser
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: 128MB
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: med-tracker-blue-rustfs-store
        serverName: med-tracker-blue
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 2000m
      memory: 512Mi
