---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: honcho
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: honcho
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
        - podSelector:
            matchLabels:
              honcho-client: 'true'
      ports:
        - port: 8000
          protocol: TCP
