---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "YAML, Flate & Mondoo"

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Relevant Changes
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    outputs:
      yaml: ${{ steps.filter.outputs.yaml }}
      kubernetes: ${{ steps.filter.outputs.kubernetes }}
      go: ${{ steps.filter.outputs.go }}
      mondoo: ${{ steps.filter.outputs.mondoo }}
    steps:
      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            yaml:
              - '**/*.yaml'
              - '**/*.yml'
              - '.yamllint*'
            kubernetes:
              - '.github/workflows/flux.yaml'
              - '.taskfiles/Flux/**'
              - 'kubernetes/**'
              - 'tests/spamhaus/**'
            go:
              - '.github/workflows/flux.yaml'
              - '.taskfiles/Kubernetes/Taskfile.yaml'
              - 'cmd/cluster-health/**'
              - 'internal/clusterhealth/**'
              - 'cmd/provisioning/**'
              - 'internal/provisioning/**'
              - '.mise/tasks/provisioning/**'
              - 'provisioning/**'
              - 'go.mod'
              - 'mise.lock'
              - 'mise.toml'
            mondoo:
              - '.github/workflows/flux.yaml'
              - 'kubernetes/**'
              - 'mondoo/**'
              - 'scripts/mondoo_scan.py'
              - 'tests/test_zitadel_access_policy.rb'
              - 'tests/grounded-docs-sync.test.mjs'

  yaml-lint:
    needs: changes
    if: ${{ needs.changes.outputs.yaml == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: Run yamllint
        uses: actionshub/yamllint@main

  yayamlls:
    name: Yayamlls
    needs: [changes, yaml-lint]
    if: >-
      ${{ always() && needs.changes.outputs.kubernetes == 'true' &&
      needs.yaml-lint.result != 'failure' &&
      needs.yaml-lint.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup yayamlls
        uses: home-operations/yayamlls/action@0.3.3
        with:
          token: ${{ github.token }}

      - name: Run yayamlls rendered validation
        run: yayamlls validate --render ./kubernetes

  spamhaus-publisher:
    name: Spamhaus publisher
    needs: changes
    if: ${{ needs.changes.outputs.kubernetes == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test alert behaviour
        run: |
          mkdir -p "$RUNNER_TEMP/spamhaus-alert-test"
          cp tests/spamhaus/alerts.test.yaml "$RUNNER_TEMP/spamhaus-alert-test/test.yaml"
          ruby -e 'require "yaml"; d=YAML.load_file("kubernetes/apps/monitoring/victoria-metrics/app/prometheusrule.yaml"); g=d.fetch("spec").fetch("groups").select { |x| x["name"] == "spamhaus" }; raise "missing spamhaus group" unless g.length == 1; File.write(ARGV.fetch(0), {"groups" => g}.to_yaml)' "$RUNNER_TEMP/spamhaus-alert-test/rules.yaml"
          docker run --rm --network none --read-only --tmpfs /tmp \
            -v "$RUNNER_TEMP/spamhaus-alert-test:/data:ro" \
            victoriametrics/vmalert-tool:v1.155.0@sha256:b03d29d0a11b906a85879a6a4009c9d0a9d5a8b9a744ebb7dd3a7721f1e78f36 \
            unittest -files=/data/test.yaml

  cluster-health:
    name: Cluster Health CLI
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.7
          install: false
          cache: false

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/...

  mondoo:
    name: Mondoo
    needs: [changes, yaml-lint, yayamlls, flate-test]
    if: >-
      ${{ always() && needs.changes.outputs.mondoo == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: '4.0.9'

      - name: Setup flate
        uses: home-operations/flate/action@v0.7.3
        with:
          base: ""
          token: ${{ github.token }}
          cache: "true"

      - name: Setup Workflow Tools
        run: |
          bash -c "$(curl -sSL https://install.mondoo.com/sh)"
          cnspec version

      - name: Verify access-policy behaviour
        run: ruby tests/test_zitadel_access_policy.rb

      - name: Setup Node for documentation refresh checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'

      - name: Verify safe documentation refresh
        run: node --test tests/grounded-docs-sync.test.mjs

      - name: Lint Mondoo policies
        run: cnspec policy lint mondoo/policies/*.mql.yaml

      - name: Verify UniFi receiver parsing
        run: |
          set -euo pipefail
          image=$(yq 'select(.kind == "StatefulSet") | .spec.template.spec.containers[0].image' kubernetes/apps/monitoring/unifi-logs/app/receiver.yaml)
          docker run --rm -v "$PWD/kubernetes/apps/monitoring/unifi-logs/app/vector.yaml:/etc/vector/vector.yaml:ro" "$image" test /etc/vector/vector.yaml

      - name: Select checked-out Flux source
        run: git update-ref refs/heads/main HEAD

      - name: Run rendered manifest scans
        env:
          FLATE_BASE: ""
        run: >-
          python3 scripts/mondoo_scan.py
          --output junit
          --report-dir mondoo-reports
          k8s-manifests --path ./kubernetes --include-posture

      - name: Upload Mondoo reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mondoo-reports
          path: mondoo-reports
          if-no-files-found: ignore

  flate-test:
    name: Flate Test
    needs: [changes, yaml-lint, yayamlls]
    if: >-
      ${{ always() && needs.changes.outputs.kubernetes == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup flate
        uses: home-operations/flate/action@v0.7.3
        with:
          base: ""
          token: ${{ github.token }}
          cache: "true"

      - name: Select checked-out Flux source
        run: git update-ref refs/heads/main HEAD

      - name: Run flate test
        env:
          FLATE_BASE: ""
        run: >-
          flate --no-progress test all
          --api-versions "policy/v1/PodDisruptionBudget,monitoring.coreos.com/v1,monitoring.coreos.com/v1/ServiceMonitor,monitoring.coreos.com/v1/PodMonitor,monitoring.coreos.com/v1/PrometheusRule"
          --path ./kubernetes

  flate-diff:
    name: Flate Diff
    needs: [changes, yaml-lint, yayamlls]
    if: >-
      ${{ always() && needs.changes.outputs.kubernetes == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup flate
        uses: home-operations/flate/action@v0.7.3
        with:
          base: ""
          token: ${{ github.token }}
          cache: "true"

      - name: Checkout PR base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .flate-base

      - name: Select each checked-out Flux source
        run: |
          set -euo pipefail
          git update-ref refs/heads/main HEAD
          git -C .flate-base update-ref refs/heads/main HEAD
          # Older base commits predate the render entry; retain their manifests.
          if [[ ! -f .flate-base/kubernetes/kustomization.yaml ]]; then
            cp kubernetes/kustomization.yaml .flate-base/kubernetes/kustomization.yaml
          fi

      - name: Run flate diff
        id: diff
        shell: bash
        env:
          FLATE_BASE: ""
        run: |
          set -euo pipefail
          flate --no-progress diff all \
            --api-versions "policy/v1/PodDisruptionBudget,monitoring.coreos.com/v1,monitoring.coreos.com/v1/ServiceMonitor,monitoring.coreos.com/v1/PodMonitor,monitoring.coreos.com/v1/PrometheusRule" \
            --path ./kubernetes \
            --path-orig ./.flate-base/kubernetes \
            -o github > flate.diff
          if [[ -s flate.diff ]]; then
            {
              echo '`````diff'
              cat flate.diff
              echo '`````'
            } > flate-comment.md
            echo 'has_diff=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_diff=false' >> "$GITHUB_OUTPUT"
          fi

      - name: PR Comment
        uses: mshick/add-pr-comment@v3
        if: ${{ steps.diff.outputs.has_diff == 'true' }}
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          message-failure: Unable to post flate diff
          message-path: flate-comment.md

  flate-success:
    if: ${{ always() }}
    needs: ["changes", "flate-diff", "flate-test", "mondoo", "spamhaus-publisher"]
    name: Flate Successful
    runs-on: ubuntu-slim
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        name: Check matrix status
        run: exit 1
