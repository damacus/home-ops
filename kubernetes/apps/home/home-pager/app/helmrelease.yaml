---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-pager
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
    controllers:
      home-pager:
        strategy: Recreate
        containers:
          app:
            image:
              repository: nginx
              tag: 1.27-alpine
              pullPolicy: IfNotPresent
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /, port: 80}
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /, port: 80}
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 3
            resources:
              requests: {cpu: 10m, memory: 32Mi}
              limits: {cpu: 100m, memory: 64Mi}
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                add: [CHOWN, SETGID, SETUID]
                drop: [ALL]
              readOnlyRootFilesystem: false
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 101
    service:
      app:
        controller: home-pager
        ports:
          http:
            port: 80
            protocol: HTTP
