---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memos-oidc-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: memos-oidc-config
    template:
      engineVersion: v2
      data:
        identity-provider.json: |
          {
            "identityProviders": [{
              "name": "identity-providers/zitadel",
              "type": "OAUTH2",
              "title": "Zitadel",
              "config": {
                "oauth2Config": {
                  "clientId": {{ .client_id | toJson }},
                  "clientSecret": {{ .client_secret | toJson }},
                  "authUrl": "https://zitadel.damacus.io/oauth/v2/authorize",
                  "tokenUrl": "https://zitadel.damacus.io/oauth/v2/token",
                  "userInfoUrl": "https://zitadel.damacus.io/oidc/v1/userinfo",
                  "scopes": ["openid", "profile", "email"],
                  "fieldMapping": {
                    "identifier": "sub",
                    "displayName": "name",
                    "email": "email",
                    "avatarUrl": "picture"
                  }
                }
              }
            }]
          }
  dataFrom:
    - extract:
        key: zitadel-memos-oidc
