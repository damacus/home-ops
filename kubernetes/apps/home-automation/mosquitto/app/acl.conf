# MQTT users have separate topic permissions.
user homeassistant
topic read homeassistant/#
topic write homeassistant/status
topic readwrite frigate/#
topic read growhat/#
topic write growhat/+/display/set
topic write growhat/+/pump/set
topic write growhat/+/buttons/+/press/set

user frigate
topic readwrite frigate/#
topic read homeassistant/status

user growhat
topic readwrite growhat/#
topic read homeassistant/status
# Discovery identifiers verified on the live GrowHAT controller.
topic write homeassistant/sensor/grow_pi_zero_w_1/#
topic write homeassistant/sensor/grow_pi_zero_w_2/#
topic write homeassistant/sensor/grow_pi_zero_w_3/#
topic write homeassistant/+/grow_pi_zero_w/#
