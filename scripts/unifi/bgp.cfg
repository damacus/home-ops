! Template: replace BGP_PASSWORD with the kube-system/cilium-bgp-auth password.
! Never commit the rendered file containing the password.
router bgp 65000
  bgp router-id 192.168.1.254
  bgp ebgp-requires-policy
  bgp listen limit 10
  neighbor home-kubernetes peer-group
  neighbor home-kubernetes remote-as 65020
  neighbor home-kubernetes password BGP_PASSWORD
  bgp listen range 192.168.1.0/24 peer-group home-kubernetes
  address-family ipv4 unicast
    neighbor home-kubernetes activate
    neighbor home-kubernetes prefix-list K3S-SERVICES in
    neighbor home-kubernetes prefix-list K3S-EXPORT out
    neighbor home-kubernetes maximum-prefix 253
    maximum-paths 3
  exit-address-family
exit
ip prefix-list K3S-SERVICES seq 5 deny 192.168.3.1/32
ip prefix-list K3S-SERVICES seq 10 permit 192.168.3.0/24 ge 32 le 32
ip prefix-list K3S-EXPORT seq 10 deny 0.0.0.0/0 le 32
