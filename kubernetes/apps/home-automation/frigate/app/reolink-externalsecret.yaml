---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate-reolink
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: frigate-reolink
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Escape credentials before substituting them into go2rtc RTSP URLs.
        FRIGATE_REOLINK_PASSWORD: '{{ .password | urlquery | replace "+" "%20" }}'
  data:
    - secretKey: password
      remoteRef:
        # Item UUID: 4udyqvco4rgul7w57whrdho6fy. Connect resolves item titles.
        key: Reolink
        property: ONVIF
