---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: unifi-logs
  namespace: flux-system
spec:
  targetNamespace: monitoring
  dependsOn:
    - name: loki
  path: ./kubernetes/apps/monitoring/unifi-logs/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  interval: 30m
  timeout: 10m
