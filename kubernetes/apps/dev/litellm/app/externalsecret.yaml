---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: litellm
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: litellm
        property: openai-api-key
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: litellm
        property: master-key
    - secretKey: LITELLM_SALT_KEY
      remoteRef:
        key: litellm
        property: salt-key
    - secretKey: HOME_ASSISTANT_TOKEN
      remoteRef:
        key: litellm
        property: home-assistant-token
    - secretKey: GRAFANA_MCP_TOKEN
      remoteRef:
        key: litellm
        property: grafana-mcp-token
