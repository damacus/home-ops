---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: physical-backup
spec:
  schedule: 35 0 * * *
  suspend: false
  jobTemplate:
    spec:
      template:
        spec:
          initContainers:
          - name: basebackup
            env:
            - name: PGHOST
              value: zitadel-green-rw.authentication.svc.cluster.local
            resources:
              limits:
                ephemeral-storage: 6Gi
          containers:
          - name: upload
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: zitadel-green-r2-credentials
                  key: aws-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: zitadel-green-r2-credentials
                  key: aws-secret-access-key
            - name: BACKUP_PREFIX
              value: physical/authentication/zitadel-green/
          volumes:
          - name: work
            emptyDir:
              sizeLimit: 6Gi
          - name: ca
            secret:
              secretName: zitadel-green-ca
              items:
              - key: ca.crt
                path: ca.crt
          - name: client
            secret:
              secretName: zitadel-green-replication
              defaultMode: 288
              items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
