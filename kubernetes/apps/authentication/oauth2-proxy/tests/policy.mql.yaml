---
policies:
  - uid: home-ops-oauth2-proxy-access
    name: OAuth2 Proxy Access Controls
    version: 1.0.0
    scoring_system: highest impact
    tags:
      mondoo.com/category: security
      mondoo.com/platform: local
    authors:
      - name: Dan Webb
        email: dan.webb@damacus.io
    groups:
      - title: OAuth2 Proxy GitOps manifests
        filters:
          - mql: asset.family.contains("unix")
        checks:
          - uid: damacus-oauth2-proxy-existing-users
    require:
      - provider: os

queries:
  - uid: damacus-oauth2-proxy-existing-users
    title: Public OAuth2 Proxy must trust existing Zitadel users
    mql: |
      helmrelease = file("kubernetes/apps/authentication/oauth2-proxy/app/helmrelease.yaml")
      helmrelease.exists
      helmrelease.content.contains("--redirect-url=https://auth.damacus.io/oauth2/callback\n              - --email-domain=*")
      helmrelease.content.contains("--authenticated-emails-file") == false
      helmrelease.content.contains("authenticated-emails.txt") == false
      helmrelease.content.contains("--allowed-group=user") == false
      action = file("kubernetes/apps/authentication/zitadel/actions/set-groups-claim.js")
      action.exists
      action.content.contains("if (!user.human)")
    docs:
      desc: Zitadel controls who can register, so the public proxy must accept any existing human user without a second email allowlist.
