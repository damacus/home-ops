    name: rustfs-dr-data-ssd-v41
  mountOptions:
    - hard
    - nfsvers=4.1
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: unas.ironstone.casa#csi_ssd#pvc-bd84c02c-3c12-4ec4-90e3-b0a3c84fa31a
    volumeAttributes:
      server: unas.ironstone.casa
      share: /csi_ssd/pvc-bd84c02c-3c12-4ec4-90e3-b0a3c84fa31a
