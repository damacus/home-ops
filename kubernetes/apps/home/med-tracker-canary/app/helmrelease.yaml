---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: med-tracker-canary
  namespace: home
spec:
  suspend: false
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-credentials

    controllers:
      med-tracker-canary:
        type: deployment
        strategy: Recreate
        serviceAccount:
          identifier: med-tracker-canary-app
        # TODO: Needs a RWX PVC
        # replicas: 2
        # rollingUpdate:
        #   maxSurge: 1
        #   maxUnavailable: 0

        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          migrate:
            image:
              repository: &repository ghcr.io/damacus/med-tracker
              tag: &tag sha-6635c39cc31c8f536206c87f6e8d98e4ce87ada9
            command: ["bin/rails", "db:prepare"]
            envFrom:
              - secretRef:
                  name: med-tracker-canary-secret
            env:
              ACTIVE_STORAGE_SERVICE: persistent
              DATABASE_ROLE: med_tracker_owner
              OTEL_TRACES_EXPORTER: none
              RAILS_ENV: production
              TZ: "Europe/London"
        containers:
          app:
            image:
              repository: *repository
              tag: *tag

            envFrom: &appEnvFrom
              - secretRef:
                  name: med-tracker-canary-secret
            env: &appEnvironment
              ACTIVE_STORAGE_SERVICE: persistent
              RAILS_ENV: production
              RAILS_FORCE_SSL: "false"
              RAILS_LOG_LEVEL: info
              OTEL_TRACES_EXPORTER: otlp
              OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
              SMTP_ENABLED: "false"
              DEMO_MODE: "true"
              TZ: "Europe/London"
              APP_URL: "https://med-tracker-canary.damacus.io"
              OIDC_ISSUER_URL: "https://zitadel.damacus.io"
              OIDC_REDIRECT_URI: "https://med-tracker-canary.damacus.io/auth/oidc/callback"
              OIDC_PROVIDER_NAME: "Zitadel"

            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /up
                    port: &port 80
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /up
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /up
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30

            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

      worker:
        type: deployment
        strategy: Recreate
        serviceAccount:
          identifier: med-tracker-canary-app
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          migrate:
            image:
              repository: *repository
              tag: *tag
            command: ["bin/rails", "db:prepare"]
            envFrom:
              - secretRef:
                  name: med-tracker-canary-secret
            env:
              ACTIVE_STORAGE_SERVICE: persistent
              DATABASE_ROLE: med_tracker_owner
              OTEL_TRACES_EXPORTER: none
              RAILS_ENV: production
              TZ: "Europe/London"
        containers:
          worker:
            image:
              repository: *repository
              tag: *tag
            command: ["bin/jobs"]
            envFrom: *appEnvFrom
            env: *appEnvironment
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - bin/rails
                      - runner
                      - >-
                        process = SolidQueue::Process.where(hostname: Socket.gethostname).where("kind LIKE ?", "Supervisor%").order(last_heartbeat_at: :desc).first;
                        exit(process && process.last_heartbeat_at >= SolidQueue.process_alive_threshold.ago ? 0 : 1)
                  initialDelaySeconds: 90
                  periodSeconds: 60
                  timeoutSeconds: 15
                  failureThreshold: 2
            resources:
              requests:
                memory: 256Mi
              limits:
                memory: 1Gi
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

      reset:
        type: cronjob
        cronjob:
          schedule: "15 4 * * 0"
          timeZone: Europe/London
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 300
          activeDeadlineSeconds: 900
          backoffLimit: 0
          successfulJobsHistory: 1
          failedJobsHistory: 3
        serviceAccount:
          identifier: med-tracker-canary-reset
        containers:
          app:
            image:
              repository: *repository
              tag: *tag
            command: ["/bin/sh", "/app/bin/canary-reset"]
            envFrom:
              - secretRef:
                  name: med-tracker-canary-secret
            env:
              ACTIVE_STORAGE_SERVICE: persistent
              RAILS_ENV: production
              RAILS_LOG_LEVEL: info
              OTEL_TRACES_EXPORTER: none
              SMTP_ENABLED: "false"
              DEMO_MODE: "true"
              DATABASE_ROLE: med_tracker_owner
              ACTIVE_STORAGE_ROOT: /app/storage
              DEMO_RESET_EXPECTED_APPLICATION_HOST: med-tracker-canary.damacus.io
              DEMO_RESET_EXPECTED_DATABASE_HOST: med-tracker-canary-rw.home.svc.cluster.local
              DEMO_RESET_EXPECTED_STORAGE_SERVICE: persistent
              DEMO_RESET_EXPECTED_STORAGE_ROOT: /app/storage
              DEMO_RESET_EXPECTED_DATABASE_ROLE: med_tracker_owner
              TZ: "Europe/London"
              APP_URL: "https://med-tracker-canary.damacus.io"
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
        pod:
          automountServiceAccountToken: true
          restartPolicy: Never
          terminationGracePeriodSeconds: 60
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

    route:
      app:
        parentRefs:
          - name: traefik-internal
            namespace: network
            sectionName: websecure
        hostnames:
          - "med-tracker-canary.ironstone.casa"
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - kind: Service
                name: med-tracker-canary
                namespace: home
                port: 80
                weight: 1
      external:
        annotations:
          external-dns.alpha.kubernetes.io/target: "traefik-ext.damacus.io"
        parentRefs:
          - name: traefik-internal
            namespace: network
            sectionName: websecure
        hostnames:
          - "med-tracker-canary.damacus.io"
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - kind: Service
                name: med-tracker-canary
                namespace: home
                port: 80
                weight: 1

    service:
      app:
        controller: med-tracker-canary
        ports:
          http:
            port: 80
    serviceAccount:
      med-tracker-canary-app:
        forceRename: med-tracker-canary-app
      med-tracker-canary-reset:
        forceRename: med-tracker-canary-reset

    persistence:
      storage:
        existingClaim: med-tracker-canary-storage
        globalMounts:
          - path: /app/storage
      reset-script:
        type: configMap
        name: med-tracker-canary-reset-script
        advancedMounts:
          reset:
            app:
              - path: /app/bin/canary-reset
                subPath: canary-reset
                readOnly: true
