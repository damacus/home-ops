---
apiVersion: "cilium.io/v2"
kind: CiliumBGPAdvertisement
metadata:
  name: cilium-bgp-advertisement
  labels:
    advertise: bgp
spec:
  advertisements:
    - advertisementType: "Service"
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchLabels:
          network.ironstone.casa/advertisement: bgp
---
apiVersion: "cilium.io/v2"
kind: CiliumBGPPeerConfig
metadata:
  name: cilium-bgp-peer-config-ipv4
spec:
  authSecretRef: cilium-bgp-auth
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: "bgp"
---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: cilium-bgp-cluster-config
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  bgpInstances:
    - name: "udm-65000"
      localASN: 65020
      peers:
        - name: "udm-65000"
          peerASN: 65000
          peerAddress: 192.168.1.254
          peerConfigRef:
            name: "cilium-bgp-peer-config-ipv4"
---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lb-pool
spec:
  serviceSelector:
    matchLabels:
      network.ironstone.casa/advertisement: bgp
  allowFirstLastIPs: "No"
  blocks:
    - start: 192.168.3.2
      stop: 192.168.3.254
