---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grounded-docs-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/default: disabled
    recurring-job.longhorn.io/grounded-docs-backup: enabled
    recurring-job.longhorn.io/grounded-docs-snapshot: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
