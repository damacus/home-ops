---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: honcho-db
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-202611230809-standard-trixie@sha256:1abcfd1cac6d53cda5185706819aab36d66a4ed88e99fc2ae44ab0826aa99f00
  instances: 2
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: honcho
      owner: honcho
      secret:
        name: honcho-db-owner
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
        - CREATE EXTENSION IF NOT EXISTS pg_trgm
        - CREATE EXTENSION IF NOT EXISTS btree_gin
  storage:
    size: 5Gi
    storageClass: openebs-hostpath
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: honcho-rustfs-store
        serverName: honcho-db
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
