---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: medtracker-canary
  namespace: flux-system
spec:
  suspend: false
  postBuild:
    substitute:
      MEDTRACKER_CANARY_IMAGE: ghcr.io/damacus/med-tracker-loco@sha256:b4f81dfa49e15e41d3ed24fb9ca303131984922a467d54f90e4eb7e45ea654f4
      MEDTRACKER_CANARY_RESET_IMAGE: ghcr.io/damacus/home-ops-medtracker-canary-reset@sha256:bd6a462322ac0d7fee84e54ed0532f5e1c8aef35c33de80dd5b750e920f7edc3
  targetNamespace: medtracker-canary
  path: ./kubernetes/apps/medtracker-canary/app
  prune: true
  dependsOn:
    - name: cloudnative-pg
    - name: openebs
    - name: external-secrets-stores
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
