---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: frigate-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: frigate
      app.kubernetes.io/instance: frigate
  ingress:
    # Traefik must never reach the unauthenticated API.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "8971"
              protocol: TCP
    # Preserve internal access if Home Assistant later leaves host networking.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: home-automation
            app.kubernetes.io/name: home-assistant
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
            - port: "8554"
              protocol: TCP
    # Home Assistant uses hostNetwork. Cilium sees its traffic as a node,
    # not as a pod identity. Trust cluster nodes, including after rescheduling;
    # this also permits other host-network processes on those trusted nodes.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
            - port: "8554"
              protocol: TCP
