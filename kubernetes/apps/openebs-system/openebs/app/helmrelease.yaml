---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
spec:
  interval: 30m
  chart:
    spec:
      chart: openebs
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    imagePullSecrets:
      - name: dockerhub-credentials

    preUpgradeHook:
      imagePullSecrets:
        - name: dockerhub-credentials

    engines:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: false
        rawfile:
          enabled: false
      replicated:
        mayastor:
          enabled: false

    localpv-provisioner:
      imagePullSecrets:
        - name: dockerhub-credentials
      enabled: true
      hostpathClass:
        enabled: true
        name: openebs-hostpath
        isDefaultClass: false
        basePath: /var/openebs/local

    loki:
      imagePullSecrets:
        - name: dockerhub-credentials
      serviceAccount:
        automountServiceAccountToken: true
        imagePullSecrets:
          - name: dockerhub-credentials
      # Retain discovery; existing S3 ruler storage is managed separately.
      sidecar:
        enableUniqueFilenames: true
        image:
          repository: ghcr.io/damacus/k8s-sideca-rs
          tag: "0.2.5"
          sha: ""
          pullPolicy: IfNotPresent
        rules:
          enabled: true
          resource: configmap
          searchNamespace: ["ALL"]
          label: loki_rule
          folder: /rules
      rbac:
        namespaced: false
        useExistingRole: openebs-loki-rule-configmaps

    alloy:
      global:
        image:
          pullSecrets:
            - name: dockerhub-credentials
