---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: hubble-ui
spec:
  scaleTargetRef:
    name: hubble-ui
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 1800
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda:9090
        interceptorRoute: hubble-ui
