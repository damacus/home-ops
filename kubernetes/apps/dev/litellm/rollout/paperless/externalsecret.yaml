---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-litellm
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: paperless-litellm
  data:
    - secretKey: api-key
      remoteRef:
        key: litellm-paperless
        property: key
