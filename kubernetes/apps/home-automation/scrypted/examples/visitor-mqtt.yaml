---
blueprint:
  name: Reolink Visitor to Scrypted doorbell
  description: Enable only when direct Scrypted doorbell presses do not work.
  domain: automation
  input:
    visitor_sensor:
      name: Verified Reolink Visitor sensor
      selector:
        entity:
          domain: binary_sensor
triggers:
  - trigger: state
    entity_id: !input visitor_sensor
    from: "off"
    to: "on"
actions:
  - action: mqtt.publish
    data:
      topic: scrypted/doorbell/reolink/visitor
      payload: "ON"
      qos: 0
      retain: false
  - delay:
      seconds: 1
  - action: mqtt.publish
    data:
      topic: scrypted/doorbell/reolink/visitor
      payload: "OFF"
      qos: 0
      retain: false
mode: queued
max: 10
