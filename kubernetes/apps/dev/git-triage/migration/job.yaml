---
apiVersion: batch/v1
kind: Job
metadata:
  name: git-triage-migrate-2201f2cb
  namespace: dev
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: private-secret-files
          image: ghcr.io/damacus/git-triage@sha256:a232ac333d894e4630db9a7e21921af870b8ac48cf19667c57ef7da5ad33e4cb
          command: [/bin/sh, -ec]
          args:
            - umask 077; for source in /source/*; do cp "$source" "/run/private/$(basename "$source")"; done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: source-secrets, mountPath: /source, readOnly: true}
            - {name: private-secrets, mountPath: /run/private}
      containers:
        - name: migrate
          image: ghcr.io/damacus/git-triage@sha256:a232ac333d894e4630db9a7e21921af870b8ac48cf19667c57ef7da5ad33e4cb
          args: [eval, GitTriage.Release.migrate()]
          env:
            - {name: GIT_TRIAGE_RUNTIME_MODE, value: migrate}
            - {name: ERL_FLAGS, value: "+S 2:2 +Q 65536"}
            - {name: DATABASE_URL_FILE, value: /run/private/database_url}
            - {name: PAYLOAD_ENCRYPTION_KEYS_FILE, value: /run/private/payload_encryption_keys}
            - {name: PAYLOAD_ENCRYPTION_CURRENT_VERSION, value: "1"}
            - {name: ERL_CRASH_DUMP, value: /tmp/erl_crash.dump}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: private-secrets, mountPath: /run/private, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: source-secrets
          secret:
            secretName: git-triage-migration
            defaultMode: 0440
        - name: private-secrets
          emptyDir:
            medium: Memory
        - name: tmp
          emptyDir: {}
