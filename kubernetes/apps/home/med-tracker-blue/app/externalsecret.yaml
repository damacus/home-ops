---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: med-tracker-blue-runtime
  namespace: home
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: med-tracker-blue-runtime
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: med_tracker_runtime
        password: "{{ .password }}"
        DATABASE_URL: "postgresql://med_tracker_runtime:{{ .password | urlquery | replace \"+\" \"%20\" }}@med-tracker-blue-rw.home.svc.cluster.local:5432/medtracker"
        AUTH_SESSION_SECRET: "{{ .AUTH_SESSION_SECRET }}"
        MEDTRACKER_SESSION_KEY: "{{ .MEDTRACKER_SESSION_KEY }}"
  dataFrom:
    - extract:
        key: med-tracker-blue-db
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: med-tracker-blue-superuser
  namespace: home
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: med-tracker-blue-superuser
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: postgres
        password: "{{ .superuser_password }}"
        DATABASE_URL: "postgresql://postgres:{{ .superuser_password | urlquery | replace \"+\" \"%20\" }}@med-tracker-blue-rw.home.svc.cluster.local:5432/medtracker"
  data:
    - secretKey: superuser_password
      remoteRef:
        key: med-tracker-blue-db
        property: superuser_password
