---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-sandbox-auth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: n8n-sandbox-auth
    template:
      engineVersion: v2
      data:
        api-keys: "{{ .api_key }}"
        runner-registration-token: "{{ .runner_registration_token }}"
        runner-api-key: "{{ .runner_api_key }}"
        runner-api-keys: "{{ .runner_api_keys }}"
  data:
    - secretKey: api_key
      remoteRef:
        key: n8n-sandbox
        property: api_key
    - secretKey: runner_registration_token
      remoteRef:
        key: n8n-sandbox
        property: runner_registration_token
    - secretKey: runner_api_key
      remoteRef:
        key: n8n-sandbox
        property: runner_api_key
    - secretKey: runner_api_keys
      remoteRef:
        key: n8n-sandbox
        property: runner_api_keys
