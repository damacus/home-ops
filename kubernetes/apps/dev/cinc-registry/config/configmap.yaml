---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cinc-registry
  namespace: dev
data:
  CINC_SM_BASE_URL: https://cinc-registry.ironstone.casa
  CINC_SM_HTTP_ADDR: ":8080"
  CINC_SM_LOG_LEVEL: info
  CINC_SM_LOG_FORMAT: json
  CINC_SM_PRIVATE_INSTANCE: 'false'
  CINC_SM_OCI_REGISTRY: zot.dev.svc.cluster.local:5000
  CINC_SM_OCI_REPOSITORY_PREFIX: cookbooks
  CINC_SM_OCI_INSECURE: 'true'
  CINC_SM_OBJECT_STORE_ENABLED: 'false'
  CINC_SM_ARTIFACT_STORE_ENABLED: 'true'
  CINC_SM_ARTIFACT_STORE_ENDPOINT: rustfs.storage.svc.cluster.local:9000
  CINC_SM_ARTIFACT_STORE_BUCKET: cinc-registry-artifacts
  CINC_SM_ARTIFACT_STORE_REGION: us-east-1
  CINC_SM_ARTIFACT_STORE_USE_SSL: 'false'
  CINC_SM_ARTIFACT_GATEWAY_URL: https://cinc-artifacts.ironstone.casa
  CINC_SM_ARTIFACT_PRESIGN_TTL: 60s
  CINC_SM_PUBLISH_TOKEN_ISSUER: https://cinc-registry.ironstone.casa
  CINC_SM_PUBLISH_TOKEN_SERVICE: cinc-registry
  CINC_SM_CI_TRUSTED_PUBLISHING: 'false'
  CINC_SM_WORKER_HTTP_ADDR: ":8081"
  CINC_SM_SYNC_RATE_PER_SEC: '2'
  CINC_SM_SYNC_USER_AGENT: cinc-supermarket-ingester/fa4e9796 (+https://gitlab.com/cinc-project/distribution/cinc-supermarket)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cinc-registry-gateway
  namespace: dev
data:
  CINC_SM_ARTIFACT_STORE_ENDPOINT: rustfs.storage.svc.cluster.local:9000
  CINC_SM_ARTIFACT_STORE_BUCKET: cinc-registry-artifacts
  CINC_SM_ARTIFACT_STORE_USE_SSL: 'false'
  CINC_SM_ARTIFACT_GATEWAY_HTTP_ADDR: ":8082"
  CINC_SM_ARTIFACT_GATEWAY_DOWNLOAD_TIMEOUT: 10m
  CINC_SM_ARTIFACT_GATEWAY_MAX_UPSTREAM_REQUESTS: '64'
