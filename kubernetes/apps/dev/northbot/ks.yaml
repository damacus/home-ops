---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: northbot
  namespace: flux-system
spec:
  targetNamespace: dev
  path: ./kubernetes/apps/dev/northbot/app
  prune: true
  dependsOn:
    - name: external-secrets-stores
    - name: forgejo
    - name: northops-postgres
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
