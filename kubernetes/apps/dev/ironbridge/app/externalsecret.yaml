---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ironbridge
  namespace: dev
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ironbridge
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SLACK_BOT_TOKEN: "{{ .slack_bot_token }}"
        SLACK_APP_TOKEN: "{{ .slack_app_token }}"
        SLACK_TEAM_ID: "{{ .slack_team_id }}"
        SLACK_ADMIN_CHANNEL_ID: "{{ .slack_admin_channel_id }}"
        DISCORD_BOT_TOKEN: "{{ .discord_bot_token }}"
        DISCORD_GUILD_ID: "{{ .discord_guild_id }}"
        DATABASE_URL: >-
          postgresql://ironbridge:{{ .db_password | urlquery | replace "+" "%20" }}@northops-postgres-rw.dev.svc.cluster.local:5432/ironbridge?sslmode=verify-full&sslrootcert=/etc/northops-postgres/ca.crt
  data:
    - secretKey: slack_bot_token
      remoteRef: {key: ironbridge, property: SLACK_BOT_TOKEN}
    - secretKey: slack_app_token
      remoteRef: {key: ironbridge, property: SLACK_APP_TOKEN}
    - secretKey: slack_team_id
      remoteRef: {key: ironbridge, property: SLACK_TEAM_ID}
    - secretKey: slack_admin_channel_id
      remoteRef: {key: ironbridge, property: SLACK_ADMIN_CHANNEL_ID}
    - secretKey: discord_bot_token
      remoteRef: {key: ironbridge, property: DISCORD_BOT_TOKEN}
    - secretKey: discord_guild_id
      remoteRef: {key: ironbridge, property: DISCORD_GUILD_ID}
    - secretKey: db_password
      remoteRef: {key: ironbridge-db, property: password}
