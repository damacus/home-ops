---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: northops-postgres
  namespace: dev
spec:
  imagePullSecrets:
    - name: ghcr-credentials
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: 18
  instances: 2
  primaryUpdateStrategy: unsupervised
  enablePDB: true
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: northbot
      owner: northbot_owner
      secret:
        name: northops-postgres-owner
  managed:
    roles:
      - name: northbot_runtime
        ensure: present
        login: true
        superuser: false
        bypassrls: false
        passwordSecret:
          name: northops-postgres-runtime
  storage:
    size: 10Gi
    storageClass: openebs-hostpath
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: northops-postgres-rustfs-store
        serverName: northops-postgres
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
