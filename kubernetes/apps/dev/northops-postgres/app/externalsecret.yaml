---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: northops-postgres-owner
  namespace: dev
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: northops-postgres-owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: northbot_owner
        password: "{{ .password }}"
        MIGRATION_DATABASE_URL: "postgresql://northbot_owner:{{ .password | urlquery | replace \"+\" \"%20\" }}@northops-postgres-rw.dev.svc.cluster.local:5432/northbot?sslmode=verify-full&sslrootcert=/etc/northops-postgres/ca.crt"
  data:
    - secretKey: password
      remoteRef:
        key: northops-postgres-owner
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: northops-postgres-runtime
  namespace: dev
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: northops-postgres-runtime
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: northbot_runtime
        password: "{{ .password }}"
        DATABASE_URL: "postgresql://northbot_runtime:{{ .password | urlquery | replace \"+\" \"%20\" }}@northops-postgres-rw.dev.svc.cluster.local:5432/northbot?sslmode=verify-full&sslrootcert=/etc/northops-postgres/ca.crt"
  data:
    - secretKey: password
      remoteRef:
        key: northops-postgres-runtime
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-cnpg-northops-postgres
  namespace: dev
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: rustfs-cnpg-northops-postgres
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        ACCESS_KEY_ID: "{{ .username }}"
        SECRET_ACCESS_KEY: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: rustfs-cnpg-northops-postgres
        property: username
    - secretKey: password
      remoteRef:
        key: rustfs-cnpg-northops-postgres
        property: password
