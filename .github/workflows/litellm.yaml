---
name: LiteLLM gateway behaviour
on:
  pull_request:
    paths:
      - '.github/workflows/litellm.yaml'
      - 'kubernetes/apps/dev/litellm/**'
      - 'kubernetes/apps/monitoring/grafana-mcp/**'
      - 'scripts/litellm_keys.py'
      - 'scripts/mealie_litellm.py'
      - 'tests/test_litellm*'
      - 'tests/test_mealie_litellm.py'
      - 'tests/fixtures/litellm/**'
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify provisioning and migration behaviour
        run: python3 -m unittest tests/test_litellm_keys.py tests/test_mealie_litellm.py
      - name: Start disposable gateway with synthetic upstreams
        run: docker compose -f tests/fixtures/litellm/compose.yaml up -d --wait --wait-timeout 300
      - name: Verify gateway boundaries
        env:
          LITELLM_TEST_URL: http://127.0.0.1:44000
          LITELLM_TEST_MASTER_KEY: sk-local-test-master
          LITELLM_TEST_MCP: '1'
        run: python3 -m unittest tests/test_litellm_gateway_live.py
      - name: Show fixture logs on failure
        if: failure()
        run: docker compose -f tests/fixtures/litellm/compose.yaml logs --tail 80
      - name: Remove disposable environment
        if: always()
        run: docker compose -f tests/fixtures/litellm/compose.yaml down --volumes
