---
apiVersion: batch/v1
kind: Job
metadata:
  name: supermarket-bootstrap-1a08e438
  namespace: dev
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: supermarket
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: generate-universe
        image: registry.gitlab.com/cinc-project/distribution/cinc-supermarket:1a08e438@sha256:7c01ead95b20a47d4b452c4c46bc36fbbb1af994323ac50bde6d1f66b7ba96d8
        args:
        - generate-universe
        envFrom:
        - configMapRef:
            name: supermarket
        - secretRef:
            name: supermarket-runtime
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
      initContainers:
      - name: migrate
        image: registry.gitlab.com/cinc-project/distribution/cinc-supermarket:1a08e438@sha256:7c01ead95b20a47d4b452c4c46bc36fbbb1af994323ac50bde6d1f66b7ba96d8
        args:
        - migrate
        env:
        - name: CINC_SM_ARTIFACT_STORE_ENABLED
          value: 'false'
        - name: CINC_SM_OBJECT_STORE_ENABLED
          value: 'false'
        envFrom:
        - configMapRef:
            name: supermarket
        - secretRef:
            name: supermarket-migrate
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
