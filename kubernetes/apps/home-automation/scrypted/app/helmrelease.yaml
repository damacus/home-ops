---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scrypted
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-credentials
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: arm64
        rockchip.feature.node.kubernetes.io/rk3588: "true"
      affinity:
        podAntiAffinity:
          # Hard separation from Frigate's NPU/VPU devices, not a preference.
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: frigate
              namespaces: [home-automation]
              topologyKey: kubernetes.io/hostname
    controllers:
      scrypted:
        type: deployment
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/koush/scrypted
              tag: v0.147.0-noble-full@sha256:e78b4fcecdd6c61acaaf22b50ccef303c738da58cc0be57afdb116521df52296
            env:
              TZ: Europe/London
              # Conservative initial limit for the selected community RKNN patch.
              SCRYPTED_RKNN_MAX_WORKERS: "1"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10443
                  periodSeconds: 10
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10443
                  periodSeconds: 10
              liveness:
                enabled: false
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                cpu: "2"
                memory: 4Gi
    service:
      app:
        controller: scrypted
        annotations:
          traefik.ingress.kubernetes.io/service.serversscheme: https
          traefik.ingress.kubernetes.io/service.serverstransport: home-automation-scrypted@kubernetescrd
        ports:
          https:
            port: 10443
    route:
      app:
        hostnames: [scrypted.ironstone.casa]
        parentRefs:
          - name: traefik-internal
            namespace: network
            sectionName: websecure
        rules:
          - filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: oauth2-proxy-forward-auth
            backendRefs:
              - kind: Service
                name: scrypted
                port: 10443
    persistence:
      config:
        existingClaim: scrypted-config
        globalMounts:
          - path: /server/volume
      credentials:
        type: secret
        name: scrypted-credentials
        defaultMode: 0400
        globalMounts:
          - path: /run/secrets/scrypted
            readOnly: true
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 256Mi
        globalMounts:
          - path: /dev/shm
