---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-sandbox-auth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: n8n-sandbox-auth
    template:
      engineVersion: v2
      data:
        api-keys: "{{ .api_key }}"
  data:
    - secretKey: api_key
      remoteRef:
        key: n8n-sandbox
        property: api_key
