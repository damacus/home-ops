---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: med-tracker
  namespace: home
spec:
  interval: 15m
  chart:
    spec:
      chart: ./charts/med-tracker
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: med-tracker
        namespace: home
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    chartNameChangeStrategy: InPlaceUpdate
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
  uninstall:
    keepHistory: false
  values:
    image:
      repository: ghcr.io/damacus/med-tracker-loco
      tag: 0.6.0
    imagePullSecrets:
      - name: ghcr-credentials
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    database:
      host: med-tracker-blue-rw.home.svc.cluster.local
      name: medtracker
      bootstrap:
        existingSecret: med-tracker-blue-superuser
      runtime:
        existingSecret: med-tracker-blue-runtime
      update:
        existingSecret: med-tracker-blue-update
    setup:
      bootstrapOnUpgrade: true
    env:
      TZ: Europe/London
      BINDING: 0.0.0.0
      PORT: "5150"
      MEDTRACKER_PUBLIC_HOST: https://med-tracker.damacus.io
      MEDTRACKER_PUBLIC_ORIGIN: https://med-tracker.damacus.io
      MEDTRACKER_COOKIE_SECURE: "true"
      MEDTRACKER_SMTP_ENABLED: "true"
      MEDTRACKER_SMTP_HOST: smtp.resend.com
      MEDTRACKER_SMTP_PORT: "587"
      MEDTRACKER_MAIL_FROM: MedTracker <notifications@damacus.io>
    envFrom:
      - secretRef:
          name: med-tracker-loco-integrations
    route:
      app:
        parentRefs:
          - name: traefik-internal
            namespace: network
            sectionName: websecure
        hostnames:
          - med-tracker.ironstone.casa
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - kind: Service
                name: med-tracker
                namespace: home
                port: 80
                weight: 1
      external:
        annotations:
          external-dns.alpha.kubernetes.io/target: traefik-ext.damacus.io
        parentRefs:
          - name: traefik-internal
            namespace: network
            sectionName: websecure
        hostnames:
          - med-tracker.damacus.io
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - kind: Service
                name: med-tracker
                namespace: home
                port: 80
                weight: 1
    service:
      port: 80
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 1Gi
  timeout: 10m
