---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: medtracker-canary
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: medtracker-canary-runtime
    template:
      data:
        DATABASE_URL: 'postgresql://medtracker_canary_runtime:{{ .runtime_password | urlquery | replace "+" "%20" }}@medtracker-canary-rw.medtracker-canary.svc.cluster.local:5432/medtracker_canary?sslmode=verify-full&sslrootcert=/etc/postgres/ca.crt'
        MEDTRACKER_CANARY_CONTROL_DATABASE_URL: 'postgresql://medtracker_canary_status:{{ .status_password | urlquery | replace "+" "%20" }}@medtracker-canary-rw.medtracker-canary.svc.cluster.local:5432/medtracker_canary_control?sslmode=verify-full&sslrootcert=/etc/postgres/ca.crt'
        MEDTRACKER_SESSION_KEY: "{{ .session_key }}"
        AUTH_SESSION_SECRET: "{{ .dose_signing_key }}"
        MEDTRACKER_CANARY_SMOKE_KEY: "{{ .smoke_key }}"
  dataFrom:
    - extract:
        key: medtracker-canary
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ghcr-credentials
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  dataFrom:
    - extract:
        key: ghcr
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: medtracker-canary-postgres
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: medtracker-canary-postgres
    template:
      data:
        username: postgres
        password: "{{ .reset_password }}"
  dataFrom:
    - extract:
        key: medtracker-canary
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: medtracker-canary-status
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: medtracker-canary-status
    template:
      data:
        username: medtracker_canary_status
        password: "{{ .status_password }}"
  dataFrom:
    - extract:
        key: medtracker-canary
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: medtracker-canary-reset
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: medtracker-canary-reset
    template:
      data:
        CONTROL_DATABASE_URL: 'postgresql://postgres:{{ .reset_password | urlquery | replace "+" "%20" }}@medtracker-canary-rw.medtracker-canary.svc.cluster.local:5432/medtracker_canary_control?sslmode=verify-full&sslrootcert=/etc/postgres/ca.crt'
        RUNTIME_PASSWORD: "{{ .runtime_password }}"
  dataFrom:
    - extract:
        key: medtracker-canary
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: medtracker-canary-setup
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: medtracker-canary-setup
    template:
      data:
        DATABASE_URL: 'postgresql://postgres:{{ .reset_password | urlquery | replace "+" "%20" }}@medtracker-canary-rw.medtracker-canary.svc.cluster.local:5432/medtracker_canary?sslmode=verify-full&sslrootcert=/etc/postgres/ca.crt'
  dataFrom:
    - extract:
        key: medtracker-canary
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: medtracker-canary-preflight
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: medtracker-canary-preflight
    template:
      data:
        DATABASE_URL: 'postgresql://postgres:{{ .reset_password | urlquery | replace "+" "%20" }}@medtracker-canary-rw.medtracker-canary.svc.cluster.local:5432/medtracker_canary_control?sslmode=verify-full&sslrootcert=/etc/postgres/ca.crt'
  dataFrom:
    - extract:
        key: medtracker-canary
