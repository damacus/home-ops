---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-network-mcp
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: unifi-network-mcp
  data:
    - secretKey: UNIFI_USERNAME
      remoteRef:
        key: unifi-network-mcp
        property: username
    - secretKey: UNIFI_PASSWORD
      remoteRef:
        key: unifi-network-mcp
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-protect-mcp
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: unifi-protect-mcp
  data:
    - secretKey: UNIFI_USERNAME
      remoteRef:
        key: unifi-protect-mcp
        property: username
    - secretKey: UNIFI_PASSWORD
      remoteRef:
        key: unifi-protect-mcp
        property: password
