---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: cinc-registry-rustfs
  namespace: dev
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://cnpg-cinc-registry/
    endpointURL: https://rustfs-dr-s3.ironstone.casa
    s3Credentials:
      accessKeyId:
        name: rustfs-cnpg-cinc-registry
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: rustfs-cnpg-cinc-registry
        key: SECRET_ACCESS_KEY
    data:
      compression: bzip2
    wal:
      compression: bzip2
      maxParallel: 2
