---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: medtracker-05-db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: medtracker-05-db
    template:
      type: kubernetes.io/basic-auth
      data:
        username: medtracker_05
        password: '{{ .password }}'
  dataFrom:
    - extract:
        key: medtracker-05-canary-db
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: medtracker-05-runtime
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: medtracker-05-runtime
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SECRET_KEY_BASE: '{{ .secret_key_base }}'
        DATABASE_URL: 'postgresql://medtracker_05:{{ .password | urlquery | replace "+" "%20" }}@medtracker-05-rw.medtracker-05-canary.svc.cluster.local:5432/medtracker_05'
        SOLID_CACHE_DATABASE_URL: 'postgresql://medtracker_05:{{ .password | urlquery | replace "+" "%20" }}@medtracker-05-rw.medtracker-05-canary.svc.cluster.local:5432/medtracker_production_cache'
        SOLID_QUEUE_DATABASE_URL: 'postgresql://medtracker_05:{{ .password | urlquery | replace "+" "%20" }}@medtracker-05-rw.medtracker-05-canary.svc.cluster.local:5432/medtracker_production_queue'
        SOLID_CABLE_DATABASE_URL: 'postgresql://medtracker_05:{{ .password | urlquery | replace "+" "%20" }}@medtracker-05-rw.medtracker-05-canary.svc.cluster.local:5432/medtracker_production_cable'
  data:
    - secretKey: secret_key_base
      remoteRef:
        key: medtracker-05-canary-runtime
        property: secret_key_base
    - secretKey: password
      remoteRef:
        key: medtracker-05-canary-db
        property: password
