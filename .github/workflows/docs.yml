name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "site_docs/**"
      - "docs/**/*.md"
      - "provisioning/**/*.md"
      - "kubernetes/apps/**/README.md"
      - "config/**"
      - "plugins/**"
      - "frontend/**"
      - "bin/bridgetown"
      - "Gemfile*"
      - "package*.json"
      - "*config.js"
      - "Rakefile"
      - ".ruby-version"
      - ".github/workflows/docs.yml"
      - ".github/workflows/docs-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/docs-build.yml

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-slim
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
