---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kured
spec:
  interval: 30m
  chart:
    spec:
      chart: kured
      version: 6.1.0
      sourceRef:
        kind: HelmRepository
        name: kured
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    configuration:
      concurrency: 1
      startTime: "7:00"
      endTime: "12:00"
      period: "10m"
      timeZone: "Europe/London"
    service:
      ipFamilyPolicy: preferDualStack
    metrics:
      create: false
    resources:
      requests:
        cpu: 15m
        memory: 20Mi
      limits:
        memory: 40Mi
    extraEnvVars:
      - name: TZ
        value: "Europe/London"
