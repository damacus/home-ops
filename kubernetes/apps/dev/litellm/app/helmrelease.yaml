---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      litellm:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            image:
              repository: ghcr.io/berriai/litellm
              tag: v1.105.1@sha256:b7b9e2c306343721802253d0dd9436b9634a2eb4e14da7c7cf06c5c7b7530802
            args:
              - --config
              - /etc/litellm/config.yaml
              - --port
              - '4000'
              - --prometheus_metrics_port
              - '4001'
            env:
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: litellm-db-owner
                    key: DATABASE_URL
              LITELLM_LOG: WARNING
              NO_DOCS: 'true'
              PROXY_BASE_URL: https://litellm.ironstone.casa
              ROOT_REDIRECT_URL: /ui
              GENERIC_AUTHORIZATION_ENDPOINT: https://zitadel.damacus.io/oauth/v2/authorize
              GENERIC_TOKEN_ENDPOINT: https://zitadel.damacus.io/oauth/v2/token
              GENERIC_USERINFO_ENDPOINT: https://zitadel.damacus.io/oidc/v1/userinfo
              GENERIC_SCOPE: openid email profile
              GENERIC_CLIENT_USE_PKCE: 'true'
              GENERIC_USER_ID_ATTRIBUTE: sub
              GENERIC_USER_DISPLAY_NAME_ATTRIBUTE: name
              PROXY_ADMIN_ID: '356498976247120897'
              HOME: /tmp
            envFrom:
              - secretRef:
                  name: litellm
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveliness
                    port: 4000
                  initialDelaySeconds: 0
                  timeoutSeconds: 5
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveliness
                    port: 4000
                  initialDelaySeconds: 0
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/readiness
                    port: 4000
                  initialDelaySeconds: 0
                  timeoutSeconds: 5
                  failureThreshold: 3
    defaultPodOptions:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-credentials
    service:
      app:
        controller: litellm
        ports:
          http:
            port: 4000
          metrics:
            port: 4001
    persistence:
      config:
        type: configMap
        name: litellm-config
        globalMounts:
          - path: /etc/litellm
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      app:
        hostnames:
          - litellm.ironstone.casa
        parentRefs:
          - name: traefik-internal
            namespace: network
            sectionName: websecure
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: app
                port: http
