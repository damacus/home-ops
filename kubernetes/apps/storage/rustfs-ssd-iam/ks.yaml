---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rustfs-ssd-iam
  namespace: flux-system
spec:
  targetNamespace: storage
  dependsOn:
    - name: rustfs-iam
    - name: cinc-registry-buckets
    - name: northops-postgres-buckets
  path: ./kubernetes/apps/storage/rustfs-ssd-iam/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 15m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
        optional: true
