---
apiVersion: batch/v1
kind: Job
metadata:
  name: home-assistant-config-ssd-verify-seed
  namespace: home-automation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verify
          image: quay.io/backube/volsync:0.16.0
          command: [/bin/bash, -c]
          args:
            - |
              set -euo pipefail
              # Both trees are read-only. Check file bytes and symlink targets.
              # These two legacy files are preserved and checked by archive-legacy.yaml.
              test -s /destination/.migration-legacy-files-20261011.tar.gz
              rsync -rlcn --delete --exclude=lost+found \
                --exclude='/CuwGysJU' \
                --exclude='/.storage/backup.corrupt.2025-01-14T10*' \
                --exclude='/.migration-legacy-files-20261011.tar.gz' \
                --out-format='%i %n' /source/ /destination/ > /tmp/differences
              differences=$(wc -l < /tmp/differences)
              echo "Content/path differences: $differences"
              cat /tmp/differences
              test "$differences" -eq 0
              find /destination -printf '%U:%G %m %y\n' > /tmp/metadata
              awk '$1 != "1000:1000" {bad++} END {print "Ownership mismatches:", bad+0; exit (bad>0)}' /tmp/metadata
              awk '($3 == "d" && $2 != "770") || ($3 == "f" && $2 != "660") {bad++} END {print "Mode mismatches:", bad+0; exit (bad>0)}' /tmp/metadata
              echo "Verified entries: $(wc -l < /tmp/metadata)"
              find /destination -type f -printf '%s\n' | awk '{bytes+=$1; files++} END {printf "Files: %d; bytes: %.0f\n", files, bytes}'
              echo 'PASS: content and paths match; all destination entries present as 1000:1000 with expected SMB modes'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: destination
              mountPath: /destination
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: source
          persistentVolumeClaim:
            claimName: home-assistant-config-hdd-migration-source
            readOnly: true
        - name: destination
          persistentVolumeClaim:
            claimName: home-assistant-config-ssd
            readOnly: true
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
