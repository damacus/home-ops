---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-cnpg-litellm
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: rustfs-cnpg-litellm
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: rustfs-cnpg-litellm
        property: username
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: rustfs-cnpg-litellm
        property: password
