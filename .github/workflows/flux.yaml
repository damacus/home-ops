---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "YAML, Flate & Ruby"

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Relevant Changes
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    outputs:
      yaml: ${{ steps.filter.outputs.yaml }}
      kubernetes: ${{ steps.filter.outputs.kubernetes }}
      ruby: ${{ steps.filter.outputs.ruby }}
      audit: ${{ steps.filter.outputs.audit }}
      mondoo: ${{ steps.filter.outputs.mondoo }}
      zitadel: ${{ steps.filter.outputs.zitadel }}
      grounded_docs: ${{ steps.filter.outputs.grounded_docs }}
      unifi_receiver: ${{ steps.filter.outputs.unifi_receiver }}
      spamhaus: ${{ steps.filter.outputs.spamhaus }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            yaml:
              - '**/*.yaml'
              - '**/*.yml'
              - '.yamllint*'
            kubernetes:
              - 'kubernetes/**'
              - '.taskfiles/Flux/**'
              - '!**/*.md'
              - '!**/*.mdx'
            ruby:
              - '**/*.rb'
              - '.ruby-version'
              - 'mise.toml'
              - 'mise.lock'
            audit:
              - 'Gemfile'
              - 'Gemfile.lock'
              - '.ruby-version'
              - '.pre-commit-config.yaml'
            mondoo:
              - 'mondoo/policies/*.mql.yaml'
            zitadel:
              - 'kubernetes/apps/authentication/zitadel/app/reconcile-access-policy.rb'
              - 'kubernetes/apps/authentication/zitadel/app/access-policy.yaml'
              - 'tests/test_zitadel_access_policy.rb'
            grounded_docs:
              - 'kubernetes/apps/dev/grounded-docs/app/sync.mjs'
              - 'kubernetes/apps/dev/grounded-docs/app/sources.json'
              - 'kubernetes/apps/dev/grounded-docs/app/refresh-cronjob.yaml'
              - 'kubernetes/apps/dev/grounded-docs/app/kustomization.yaml'
              - 'tests/grounded-docs-sync.test.mjs'
            unifi_receiver:
              - 'kubernetes/apps/monitoring/unifi-logs/app/receiver.yaml'
              - 'kubernetes/apps/monitoring/unifi-logs/app/vector.yaml'
            spamhaus:
              - 'kubernetes/apps/network/spamhaus/**'
              - 'kubernetes/apps/monitoring/victoria-metrics/app/prometheusrule.yaml'
              - 'tests/spamhaus/**'
              - '!**/*.md'
              - '!**/*.mdx'
            docs:
              - 'site_docs/**'
              - 'docs/**/*.md'
              - 'provisioning/**/*.md'
              - 'kubernetes/apps/**/README.md'
              - 'config/**'
              - 'plugins/**'
              - 'frontend/**'
              - 'bin/bridgetown'
              - 'Gemfile*'
              - 'package*.json'
              - '*config.js'
              - 'Rakefile'
              - '.ruby-version'
              - '.github/workflows/docs.yml'
              - '.github/workflows/docs-build.yml'

  yaml-lint:
    needs: changes
    if: ${{ needs.changes.outputs.yaml == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: Run yamllint
        uses: actionshub/yamllint@main

  yayamlls:
    name: Yayamlls
    needs: [changes, yaml-lint]
    if: >-
      ${{ always() && needs.changes.outputs.kubernetes == 'true' &&
      needs.yaml-lint.result != 'failure' &&
      needs.yaml-lint.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup yayamlls
        uses: home-operations/yayamlls/action@0.3.3
        with:
          token: ${{ github.token }}

      - name: Run yayamlls rendered validation
        run: yayamlls validate --render ./kubernetes

  spamhaus-publisher:
    name: Spamhaus publisher
    needs: changes
    if: ${{ needs.changes.outputs.spamhaus == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test alert behaviour
        run: |
          mkdir -p "$RUNNER_TEMP/spamhaus-alert-test"
          cp tests/spamhaus/alerts.test.yaml "$RUNNER_TEMP/spamhaus-alert-test/test.yaml"
          ruby -e 'require "yaml"; d=YAML.load_file("kubernetes/apps/monitoring/victoria-metrics/app/prometheusrule.yaml"); g=d.fetch("spec").fetch("groups").select { |x| x["name"] == "spamhaus" }; raise "missing spamhaus group" unless g.length == 1; File.write(ARGV.fetch(0), {"groups" => g}.to_yaml)' "$RUNNER_TEMP/spamhaus-alert-test/rules.yaml"
          docker run --rm --network none --read-only --tmpfs /tmp \
            -v "$RUNNER_TEMP/spamhaus-alert-test:/data:ro" \
            victoriametrics/vmalert-tool:v1.155.0@sha256:b03d29d0a11b906a85879a6a4009c9d0a9d5a8b9a744ebb7dd3a7721f1e78f36 \
            unittest -files=/data/test.yaml

  ruby-tools:
    name: Ruby tooling
    needs: changes
    if: ${{ needs.changes.outputs.ruby == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: .ruby-version
      - name: Check Ruby syntax
        run: git ls-files -z '*.rb' | xargs -0 -n1 ruby -c

  gem-audit:
    name: Gem dependency audit
    needs: changes
    if: ${{ needs.changes.outputs.audit == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Audit gem dependencies
        run: bundle exec bundle-audit check --update

  mondoo:
    name: Mondoo policy lint
    needs: changes
    if: ${{ needs.changes.outputs.mondoo == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up cnspec
        run: |
          bash -c "$(curl -sSL https://install.mondoo.com/sh)"
          cnspec version
      - name: Lint Mondoo policies
        run: cnspec policy lint mondoo/policies/*.mql.yaml

  zitadel-policy:
    name: Zitadel access policy
    needs: changes
    if: ${{ needs.changes.outputs.zitadel == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: .ruby-version
      - name: Verify access-policy behaviour
        run: ruby tests/test_zitadel_access_policy.rb

  grounded-docs-refresh:
    name: Grounded Docs refresh
    needs: changes
    if: ${{ needs.changes.outputs.grounded_docs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
      - name: Verify safe documentation refresh
        run: node --test tests/grounded-docs-sync.test.mjs

  unifi-receiver:
    name: UniFi receiver parsing
    needs: changes
    if: ${{ needs.changes.outputs.unifi_receiver == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: .ruby-version
      - name: Verify UniFi receiver parsing
        run: |
          set -euo pipefail
          image=$(ruby -ryaml -e 'puts YAML.load_stream(File.read(ARGV.fetch(0))).find { |doc| doc["kind"] == "StatefulSet" }.fetch("spec").fetch("template").fetch("spec").fetch("containers").first.fetch("image")' kubernetes/apps/monitoring/unifi-logs/app/receiver.yaml)
          docker run --rm -v "$PWD/kubernetes/apps/monitoring/unifi-logs/app/vector.yaml:/etc/vector/vector.yaml:ro" "$image" test /etc/vector/vector.yaml

  flate-test:
    name: Flate Test
    needs: [changes, yaml-lint, yayamlls]
    if: >-
      ${{ always() && needs.changes.outputs.kubernetes == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup flate
        uses: home-operations/flate/action@v0.7.3
        with:
          base: ""
          token: ${{ github.token }}
          cache: "true"

      - name: Select checked-out Flux source
        run: git update-ref refs/heads/main HEAD

      - name: Run flate test
        env:
          FLATE_BASE: ""
        run: >-
          flate --no-progress test all
          --api-versions "policy/v1/PodDisruptionBudget,monitoring.coreos.com/v1,monitoring.coreos.com/v1/ServiceMonitor,monitoring.coreos.com/v1/PodMonitor,monitoring.coreos.com/v1/PrometheusRule"
          --path ./kubernetes

  flate-diff:
    name: Flate Diff
    needs: [changes, yaml-lint, yayamlls]
    if: >-
      ${{ always() && needs.changes.outputs.kubernetes == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup flate
        uses: home-operations/flate/action@v0.7.3
        with:
          base: ""
          token: ${{ github.token }}
          cache: "true"

      - name: Checkout PR base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .flate-base

      - name: Select each checked-out Flux source
        run: |
          set -euo pipefail
          git update-ref refs/heads/main HEAD
          git -C .flate-base update-ref refs/heads/main HEAD
          # Older base commits predate the render entry; retain their manifests.
          if [[ ! -f .flate-base/kubernetes/kustomization.yaml ]]; then
            cp kubernetes/kustomization.yaml .flate-base/kubernetes/kustomization.yaml
          fi

      - name: Run flate diff
        id: diff
        shell: bash
        env:
          FLATE_BASE: ""
        run: |
          set -euo pipefail
          flate --no-progress diff all \
            --api-versions "policy/v1/PodDisruptionBudget,monitoring.coreos.com/v1,monitoring.coreos.com/v1/ServiceMonitor,monitoring.coreos.com/v1/PodMonitor,monitoring.coreos.com/v1/PrometheusRule" \
            --path ./kubernetes \
            --path-orig ./.flate-base/kubernetes \
            -o github > flate.diff
          if [[ -s flate.diff ]]; then
            {
              echo '`````diff'
              cat flate.diff
              echo '`````'
            } > flate-comment.md
            echo 'has_diff=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_diff=false' >> "$GITHUB_OUTPUT"
          fi

      - name: PR Comment
        uses: mshick/add-pr-comment@v3
        if: ${{ steps.diff.outputs.has_diff == 'true' }}
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          message-failure: Unable to post flate diff
          message-path: flate-comment.md

  documentation:
    name: Documentation
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/docs-build.yml

  flate-success:
    if: ${{ always() }}
    needs:
      - changes
      - yaml-lint
      - yayamlls
      - flate-diff
      - flate-test
      - ruby-tools
      - gem-audit
      - mondoo
      - zitadel-policy
      - grounded-docs-refresh
      - unifi-receiver
      - spamhaus-publisher
      - documentation
    name: Flate Successful
    runs-on: ubuntu-slim
    steps:
      - name: Require successful selected checks
        if: >-
          ${{ needs.changes.result != 'success' ||
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          (needs.changes.outputs.yaml == 'true' && (needs.yaml-lint.result != 'success')) ||
          (needs.changes.outputs.kubernetes == 'true' && (needs.yayamlls.result != 'success' || needs.flate-test.result != 'success' || needs.flate-diff.result != 'success')) ||
          (needs.changes.outputs.ruby == 'true' && (needs.ruby-tools.result != 'success')) ||
          (needs.changes.outputs.audit == 'true' && (needs.gem-audit.result != 'success')) ||
          (needs.changes.outputs.mondoo == 'true' && (needs.mondoo.result != 'success')) ||
          (needs.changes.outputs.zitadel == 'true' && (needs.zitadel-policy.result != 'success')) ||
          (needs.changes.outputs.grounded_docs == 'true' && (needs.grounded-docs-refresh.result != 'success')) ||
          (needs.changes.outputs.unifi_receiver == 'true' && (needs.unifi-receiver.result != 'success')) ||
          (needs.changes.outputs.spamhaus == 'true' && (needs.spamhaus-publisher.result != 'success')) ||
          (needs.changes.outputs.docs == 'true' && (needs.documentation.result != 'success')) }}
        run: |
          echo "::error::Change classification or a required selected check did not succeed"
          exit 1
      - name: Confirm required checks passed
        run: echo "All selected checks passed; unselected checks may be skipped"
