---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-cnpg-northops-v1
  namespace: storage
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: rustfs-cnpg-northops-v1
    template:
      engineVersion: v2
      data:
        RUSTFS_CNPG_NORTHOPS_ACCESS_KEY: "{{ .username }}"
        RUSTFS_CNPG_NORTHOPS_SECRET_KEY: "{{ .password }}"
  dataFrom:
    - extract:
        # Keep this version stable; rotations create a new item and bootstrap Job.
        key: rustfs-cnpg-northops-v1
