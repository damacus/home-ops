---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wyoming-whisper
  namespace: home-automation
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      whisper:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: rhasspy/wyoming-whisper
              tag: 3.8.1@sha256:ba6fcb6056ebe237d15a325381763a80af2fc8fcedaa04f6a714a7375eb20d80
            args:
              - --model
              - Systran/faster-distil-whisper-small.en
              - --language
              - en
              - --data-dir
              - /data
              - --compute-type
              - int8
            env:
              TZ: Europe/London

            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false

            resources:
              requests:
                cpu: 25m
                memory: 1Gi
              limits:
                cpu: 4000m
                memory: 4Gi

        pod:
          securityContext:
            runAsUser: 1030
            runAsGroup: 1030
            runAsNonRoot: true
            fsGroup: 1030
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroups: [100]

    service:
      app:
        controller: whisper
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "192.168.3.232"
        labels:
          network.ironstone.casa/advertisement: bgp
        ports:
          whisper:
            enabled: true
            port: 10300
            protocol: TCP

    persistence:
      models:
        existingClaim: whisper-models-ssd
        globalMounts:
          - path: /data
