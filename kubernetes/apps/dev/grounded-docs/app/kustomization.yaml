---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
  - pvc.yaml
  - httproute.yaml
  - middleware.yaml
  - networkpolicy.yaml
  - refresh-cronjob.yaml
configMapGenerator:
  - name: grounded-docs-config
    files:
      - config.yaml
      - sources.json
      - sync.mjs
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
