---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "YAML, Flate & Mondoo"

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Relevant Changes
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    outputs:
      yaml: ${{ steps.filter.outputs.yaml }}
      kubernetes: ${{ steps.filter.outputs.kubernetes }}
      go: ${{ steps.filter.outputs.go }}
      mondoo: ${{ steps.filter.outputs.mondoo }}
      mqtt: ${{ steps.filter.outputs.mqtt }}
      redis: ${{ steps.filter.outputs.redis }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            yaml:
              - '**/*.yaml'
              - '**/*.yml'
              - '.yamllint*'
            kubernetes:
              - '.github/workflows/flux.yaml'
              - '.taskfiles/Flux/**'
              - 'kubernetes/**'
              - 'tests/spamhaus/**'
            go:
              - '.github/workflows/flux.yaml'
              - '.taskfiles/Kubernetes/Taskfile.yaml'
              - 'cmd/cluster-health/**'
              - 'internal/clusterhealth/**'
              - 'cmd/provisioning/**'
              - 'internal/provisioning/**'
              - '.mise/tasks/provisioning/**'
              - 'provisioning/**'
              - 'go.mod'
              - 'mise.lock'
              - 'mise.toml'
            mondoo:
              - '.github/workflows/flux.yaml'
              - 'kubernetes/**'
              - 'mondoo/**'
              - 'tests/test_metrics_ui_auth.py'
              - 'tests/test_redis_export.py'
              - 'tests/test_paperless_repository.py'
              - 'tests/test_kured_reboot_markers.py'
              - 'tests/test_system_upgrade_health_gate.py'
              - 'tests/test_maintenance_charts.py'
              - 'scripts/mondoo_scan.py'
              - 'tests/test_zitadel_access_policy.rb'
              - 'tests/test_zitadel_config.py'
              - 'tests/test_gateway_api_source.py'
              - 'tests/test_loki_rule_watchers.py'
              - 'tests/test_ksm_secret_access.py'
              - 'tests/grounded-docs-sync.test.mjs'
            mqtt:
              - '.github/workflows/flux.yaml'
              - 'kubernetes/apps/home-automation/mosquitto/**'
              - 'tests/check_mqtt_acl.py'
            redis:
              - '.github/workflows/flux.yaml'
              - 'kubernetes/apps/database/redis/**'
              - 'kubernetes/apps/home-automation/paperless/app/**'
              - 'kubernetes/apps/home-automation/n8n/app/**'
              - 'kubernetes/apps/home/penpot/app/**'
              - 'tests/check_redis_access.py'
            contracts:
              - '.github/workflows/flux.yaml'
              - '.taskfiles/Kubernetes/Taskfile.yaml'
              - 'kubernetes/apps/home/med-tracker/**'
              - 'kubernetes/apps/storage/rustfs-iam/**'
              - 'tests/mondoo/rustfs-iam.mql.yaml'

  yaml-lint:
    needs: changes
    if: ${{ needs.changes.outputs.yaml == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: Run yamllint
        uses: actionshub/yamllint@main

  yayamlls:
    name: Yayamlls
    needs: [changes, yaml-lint]
    if: >-
      ${{ always() && needs.changes.outputs.kubernetes == 'true' &&
      needs.yaml-lint.result != 'failure' &&
      needs.yaml-lint.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup yayamlls
        uses: home-operations/yayamlls/action@0.3.3
        with:
          token: ${{ github.token }}

      - name: Run yayamlls rendered validation
        run: yayamlls validate --render ./kubernetes

  spamhaus-publisher:
    name: Spamhaus publisher
    needs: changes
    if: ${{ needs.changes.outputs.kubernetes == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 -m unittest discover -s tests/spamhaus -v
      - name: Test alert behaviour
        run: |
          mkdir -p "$RUNNER_TEMP/spamhaus-alert-test"
          cp tests/spamhaus/alerts.test.yaml "$RUNNER_TEMP/spamhaus-alert-test/test.yaml"
          ruby -e 'require "yaml"; d=YAML.load_file("kubernetes/apps/monitoring/victoria-metrics/app/prometheusrule.yaml"); g=d.fetch("spec").fetch("groups").select { |x| x["name"] == "spamhaus" }; raise "missing spamhaus group" unless g.length == 1; File.write(ARGV.fetch(0), {"groups" => g}.to_yaml)' "$RUNNER_TEMP/spamhaus-alert-test/rules.yaml"
          docker run --rm --network none --read-only --tmpfs /tmp \
            -v "$RUNNER_TEMP/spamhaus-alert-test:/data:ro" \
            victoriametrics/vmalert-tool:v1.155.0@sha256:b03d29d0a11b906a85879a6a4009c9d0a9d5a8b9a744ebb7dd3a7721f1e78f36 \
            unittest -files=/data/test.yaml

  mqtt-access:
    name: MQTT Access
    needs: changes
    if: ${{ needs.changes.outputs.mqtt == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify allowed and denied MQTT access
        run: python3 tests/check_mqtt_acl.py

  redis-access:
    name: Redis Access
    needs: changes
    if: ${{ needs.changes.outputs.redis == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Verify Redis authentication and persistence
        run: |
          python3 -m venv "$RUNNER_TEMP/redis-tests"
          "$RUNNER_TEMP/redis-tests/bin/pip" install PyYAML==6.0.3
          "$RUNNER_TEMP/redis-tests/bin/python" tests/check_redis_access.py

  cluster-health:
    name: Cluster Health CLI
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.5
          install: false
          cache: false

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/...

  mondoo:
    name: Mondoo
    needs: [changes, yaml-lint, yayamlls, flate-test]
    if: >-
      ${{ always() && needs.changes.outputs.mondoo == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: '4.0.9'

      - name: Setup flate
        uses: home-operations/flate/action@v0.7.3
        with:
          base: ""
          token: ${{ github.token }}
          cache: "true"

      - name: Setup Workflow Tools
        run: |
          bash -c "$(curl -sSL https://install.mondoo.com/sh)"
          cnspec version

      - name: Verify access-policy and upgrade behaviour
        run: |
          python3 -m unittest tests/test_zitadel_config.py tests/test_gateway_api_source.py
          python3 -m unittest tests/test_kured_reboot_markers.py tests/test_system_upgrade_health_gate.py
          ruby tests/test_zitadel_access_policy.rb

