---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ironbridge
  namespace: dev
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ironbridge
  template:
    metadata:
      labels:
        app: ironbridge
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ironbridge
          image: forgejo.ironstone.casa/damacus/ironbridge@sha256:7d309ca04a91c1fa07c22d890275a46942bdd8e7f4af7737751ca12c40be985c
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: ironbridge
          env:
            - name: BRIDGE_ENABLED
              value: "false"
            - name: BRIDGE_DIRECTION
              value: both
            - name: BRIDGE_SCOPE
              value: all
            - name: SLACK_CHANNEL_IDS
              value: ""
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 256Mi
          readinessProbe:
            exec:
              command: [/usr/local/bin/ironbridge, status]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 2
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/northops-postgres
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: postgres-ca
          secret:
            secretName: northops-postgres-ca
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
