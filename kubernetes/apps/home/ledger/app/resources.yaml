---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ledger-data
  namespace: home
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app: ledger
    recurring-job-group.longhorn.io/default: enabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: home
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ledger
  template:
    metadata:
      labels:
        app: ledger
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ledger
          image: forgejo.ironstone.casa/damacus/usage-ledger@sha256:d6882f5127555f0b18a740fc3833c6b3f823b32d509ac61bcff545fe7c7d6844
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LEDGER_TOKEN_FILE
              value: /run/ledger/token
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: data
              mountPath: /data
            - name: credential
              mountPath: /run/ledger
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ledger-data
        - name: credential
          secret:
            secretName: ledger-collector
---
apiVersion: v1
kind: Service
metadata:
  name: ledger
  namespace: home
spec:
  selector:
    app: ledger
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ledger
  namespace: home
  annotations:
    external-dns.alpha.kubernetes.io/target: traefik-int.ironstone.casa
spec:
  parentRefs:
    - name: traefik-internal
      namespace: network
      sectionName: websecure
  hostnames: [ledger.ironstone.casa]
  rules:
    - backendRefs:
        - name: ledger
          port: 8080

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ledger
  namespace: home
spec:
  podSelector:
    matchLabels:
      app: ledger
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
