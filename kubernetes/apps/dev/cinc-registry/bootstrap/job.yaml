---
apiVersion: batch/v1
kind: Job
metadata:
  name: cinc-registry-bootstrap-9980c147
  namespace: dev
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: cinc-registry
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: generate-universe
        image: registry.gitlab.com/cinc-project/distribution/cinc-supermarket:9980c147@sha256:07ead472588a3774960d4ee7f2b94e57db79392894c547452983a322337224a6
        args:
        - generate-universe
        envFrom:
        - configMapRef:
            name: cinc-registry
        - secretRef:
            name: cinc-registry-runtime
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
      initContainers:
      - name: migrate
        image: registry.gitlab.com/cinc-project/distribution/cinc-supermarket:9980c147@sha256:07ead472588a3774960d4ee7f2b94e57db79392894c547452983a322337224a6
        args:
        - migrate
        env:
        - name: CINC_SM_ARTIFACT_STORE_ENABLED
          value: 'false'
        - name: CINC_SM_OBJECT_STORE_ENABLED
          value: 'false'
        envFrom:
        - configMapRef:
            name: cinc-registry
        - secretRef:
            name: cinc-registry-migrate
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
