---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: medtracker-canary
  namespace: flux-system
spec:
  suspend: true
  targetNamespace: medtracker-canary
  path: ./kubernetes/apps/medtracker-canary/app
  prune: true
  dependsOn:
    - name: cloudnative-pg
    - name: openebs
    - name: external-secrets-stores
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
