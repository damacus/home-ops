apiVersion: batch/v1
kind: Job
metadata:
  name: med-tracker-dmd-bucket-v1
  namespace: storage
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 600
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rc
          image: rustfs/rc:v0.1.37@sha256:7e93fd410a8fe51514f89373e093392c92095b98dc6140335fcfe956810c4c80
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          env:
            - name: RUSTFS_ENDPOINT
              value: http://rustfs.storage.svc.cluster.local:9000
            - name: HOME
              value: /tmp
            - name: RUSTFS_MED_TRACKER_DMD_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: med-tracker-dmd-storage
                  key: AWS_ACCESS_KEY_ID
            - name: RUSTFS_MED_TRACKER_DMD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: med-tracker-dmd-storage
                  key: AWS_SECRET_ACCESS_KEY
          envFrom:
            - secretRef:
                name: rustfs-credentials
          command: [/bin/sh, /scripts/bootstrap.sh, med-tracker-dmd]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: bootstrap-script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: bootstrap-script
          configMap:
            name: rustfs-iam-bootstrap
            defaultMode: 0555
