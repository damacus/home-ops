---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: n8n-sandbox-service
  namespace: flux-system
spec:
  targetNamespace: n8n-sandbox
  path: ./kubernetes/apps/n8n-sandbox/n8n-sandbox-service/app
  prune: true
  dependsOn:
    - name: cert-manager-issuers
    - name: external-secrets-stores
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
