---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: northops-postgres
  namespace: dev
spec:
  schedule: "0 7 0 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      objectStore: northops-postgres-rustfs-store
  cluster:
    name: northops-postgres
