---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: supermarket
  namespace: dev
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      labels:
        app.kubernetes.io/part-of: supermarket
    controllers:
      api:
        type: deployment
        replicas: 1
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            image:
              repository: registry.gitlab.com/cinc-project/distribution/cinc-supermarket
              tag: b2476b7a@sha256:7988c50e9f56f270a3f12e495fa7b23120b4772129e2ca157e014132e8300cbf
            args:
            - serve
            envFrom:
            - configMapRef:
                name: supermarket
            - secretRef:
                name: supermarket-runtime
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 512Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: "/healthz"
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: "/readyz"
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
            env:
              GOMEMLIMIT: 400MiB
              CINC_SM_SOURCES_FILE: /etc/supermarket/sources/sources.json
              CINC_SM_PERMISSION_HTTP_ADDR: ":8084"
              CINC_SM_PERMISSION_CA_FILE: /etc/supermarket/permissions/ca.crt
              CINC_SM_PERMISSION_CERT_FILE: /etc/supermarket/permissions/tls.crt
              CINC_SM_PERMISSION_KEY_FILE: /etc/supermarket/permissions/tls.key
      worker:
        type: deployment
        replicas: 1
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            image:
              repository: registry.gitlab.com/cinc-project/distribution/cinc-supermarket
              tag: b2476b7a@sha256:7988c50e9f56f270a3f12e495fa7b23120b4772129e2ca157e014132e8300cbf
            args:
            - worker
            env:
              CINC_SM_SOURCES_FILE: /etc/supermarket/sources/sources.json
            envFrom:
            - configMapRef:
                name: supermarket
            - secretRef:
                name: supermarket-runtime
            - secretRef:
                name: supermarket-github-source
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                memory: 256Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: "/healthz"
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: "/readyz"
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
      gateway:
        type: deployment
        replicas: 1
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            image:
              repository: registry.gitlab.com/cinc-project/distribution/cinc-supermarket
              tag: b2476b7a@sha256:7988c50e9f56f270a3f12e495fa7b23120b4772129e2ca157e014132e8300cbf
            args:
            - artifact-gateway
            env:
              CINC_SM_PUBLISH_TOKEN_ISSUER: https://supermarket.ironstone.casa
              CINC_SM_PERMISSION_URL: https://supermarket-permissions.dev.svc.cluster.local:8084/internal/v1/permissions
              CINC_SM_PERMISSION_CA_FILE: /etc/supermarket/permissions/ca.crt
              CINC_SM_PERMISSION_CERT_FILE: /etc/supermarket/permissions/tls.crt
              CINC_SM_PERMISSION_KEY_FILE: /etc/supermarket/permissions/tls.key
              CINC_SM_TRANSFER_PUBLIC_KEY_FILE: /etc/supermarket/verifier/token.crt
            envFrom:
            - configMapRef:
                name: supermarket-gateway
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: "/healthz"
                    port: 8082
                  initialDelaySeconds: 5
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: "/readyz"
                    port: 8082
                  initialDelaySeconds: 5
                  periodSeconds: 10
    service:
      api:
        controller: api
        type: ClusterIP
        ports:
          http:
            port: 8080
      gateway:
        controller: gateway
        type: ClusterIP
        ports:
          http:
            port: 8082
      permissions:
        controller: api
        type: ClusterIP
        ports:
          https:
            port: 8084
    persistence:
      sources:
        type: configMap
        name: supermarket-sources
        advancedMounts:
          api:
            app:
            - path: /etc/supermarket/sources
              readOnly: true
          worker:
            app:
            - path: /etc/supermarket/sources
              readOnly: true
      permission-server:
        type: secret
        name: supermarket-permissions-server
        advancedMounts:
          api:
            app:
            - path: /etc/supermarket/permissions
              readOnly: true
      permission-gateway:
        type: secret
        name: supermarket-permissions-gateway
        advancedMounts:
          gateway:
            app:
            - path: /etc/supermarket/permissions
              readOnly: true
      transfer-verifier:
        type: secret
        name: supermarket-transfer-verifier
        advancedMounts:
          gateway:
            app:
            - path: /etc/supermarket/verifier
              readOnly: true
