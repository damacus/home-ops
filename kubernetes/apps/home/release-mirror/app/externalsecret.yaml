---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: release-mirror
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: release-mirror
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SESSION_SECRET: "{{ .session_secret }}"
        BROWSER_CLIENT_SECRET: "{{ .browser_client_secret }}"
        config.json: |
          {
            "publicUrl": "https://releases.damacus.io",
            "databasePath": "/data/catalogue.sqlite3",
            "sessionSecretEnv": "SESSION_SECRET",
            "bootstrap": {
              "kind": "human",
              "issuer": "https://zitadel.damacus.io",
              "subject": {{ .bootstrap_subject | toJson }}
            },
            "workloadIssuers": [{
              "issuer": "https://forgejo.ironstone.casa/api/actions",
              "audience": "https://releases.damacus.io",
              "jwksUri": "https://forgejo.ironstone.casa/api/actions/.well-known/keys",
              "algorithms": ["RS256"],
              "tokenType": "JWT",
              "repositoryClaim": "repository_id",
              "maxLifetime": 3600
            }],
            "browserOidc": {
              "issuer": "https://zitadel.damacus.io",
              "clientId": {{ .browser_client_id | toJson }},
              "clientSecretEnv": "BROWSER_CLIENT_SECRET",
              "signingAlgorithm": "RS256"
            }
          }
  dataFrom:
    - extract:
        key: release-mirror
