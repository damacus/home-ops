---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-config-longhorn
  namespace: home-automation
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi
