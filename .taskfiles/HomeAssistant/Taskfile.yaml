---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  UNACCOUNTED_ELECTRICITY_SCRIPT: >-
    {{.SCRIPTS_DIR}}/home_assistant_unaccounted_electricity.py

tasks:
  unaccounted-electricity:
    desc: Report unaccounted Home Assistant electricity for the last 24 hours
    silent: true
    summary: |
      Runs a read-only analysis inside the Home Assistant pod. It compares the
      whole-home meter with the Energy dashboard's configured device sensors,
      estimates the residual base load, and detects sustained five-minute
      spikes.

      Examples:
        task home-assistant:unaccounted-electricity
        task home-assistant:unaccounted-electricity format=json
    vars:
      FORMAT: '{{.format | default "human"}}'
      HOURS: '{{.hours | default "24"}}'
      MINIMUM_COVERAGE: '{{.minimum_coverage | default "0.95"}}'
    cmd: >-
      kubectl exec -i -n home-automation statefulset/home-assistant --
      python - --format {{.FORMAT}} --hours {{.HOURS}}
      --minimum-coverage {{.MINIMUM_COVERAGE}}
      < {{.UNACCOUNTED_ELECTRICITY_SCRIPT}}
    preconditions:
      - {
          msg: "Missing unaccounted electricity script",
          sh: "test -f {{.UNACCOUNTED_ELECTRICITY_SCRIPT}}",
        }
      - { msg: "Missing kubectl", sh: "command -v kubectl >/dev/null" }
