---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unifi-mcp
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - unifi-network-mcp
          - unifi-protect-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dev
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 3000
          protocol: TCP
        - port: 3001
          protocol: TCP
