---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: retired-medtracker-scrapes
  namespace: flux-system
spec:
  # RBAC remains reconcilable after the retired canary namespace is removed.
  path: ./kubernetes/apps/monitoring/retired-medtracker-scrapes/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
