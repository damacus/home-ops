---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: physical-backup
spec:
  schedule: 5 1 * * *
  suspend: false
  jobTemplate:
    spec:
      template:
        spec:
          initContainers:
          - name: basebackup
            env:
            - name: PGHOST
              value: litellm-db-rw.dev.svc.cluster.local
            resources:
              limits:
                ephemeral-storage: 38Gi
          containers:
          - name: upload
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: litellm-db-r2-credentials
                  key: aws-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-db-r2-credentials
                  key: aws-secret-access-key
            - name: BACKUP_PREFIX
              value: physical/dev/litellm-db/
          volumes:
          - name: work
            emptyDir:
              sizeLimit: 38Gi
          - name: ca
            secret:
              secretName: litellm-db-ca
              items:
              - key: ca.crt
                path: ca.crt
          - name: client
            secret:
              secretName: litellm-db-replication
              defaultMode: 288
              items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
