---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: zitadel-access-policy
  namespace: authentication
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/component: access-policy
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconciler
              image: docker.io/library/ruby:4.0-alpine@sha256:1ca7cb33e970630d571e0da6140e0bc925faec8f1f8f51f9f2cdf5e5f5eed7c9
              command:
                - ruby
                - /config/reconcile-access-policy.rb
              env:
                - name: ZITADEL_ENDPOINT
                  value: http://zitadel.authentication.svc.cluster.local:8080
                - name: ZITADEL_ISSUER
                  value: https://zitadel.damacus.io
                - name: ZITADEL_POLICY_FILE
                  value: /config/access-policy.yaml
                - name: ZITADEL_SERVICE_ACCOUNT_KEY
                  value: /var/run/secrets/zitadel/service-account.json
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: service-account-key
                  mountPath: /var/run/secrets/zitadel
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: zitadel-access-policy
            - name: service-account-key
              secret:
                secretName: zitadel-admin-sa
                items:
                  - key: zitadel-admin-sa.json
                    path: service-account.json
