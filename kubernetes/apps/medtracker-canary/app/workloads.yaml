---
apiVersion: v1
kind: Service
metadata:
  name: medtracker-canary
spec:
  selector:
    app: medtracker-canary-server
  ports:
    - name: http
      port: 5150
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: medtracker-canary
  annotations:
    external-dns.alpha.kubernetes.io/target: traefik-ext.damacus.io
spec:
  parentRefs:
    - name: traefik-internal
      namespace: network
      sectionName: websecure
  hostnames:
    - med-tracker-loco.damacus.io
  rules:
    - backendRefs:
        - name: medtracker-canary
          port: 5150
