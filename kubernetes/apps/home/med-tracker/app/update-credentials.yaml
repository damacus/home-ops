---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: med-tracker-blue-update
  namespace: home
spec:
  # Reuse the shared 1Password provider; no database credentials are stored in Git.
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: med-tracker-blue-update
    template:
      engineVersion: v2
      data:
        # Only the migration Job consumes this non-superuser schema-update login.
        DATABASE_URL: "postgresql://med_tracker_update:{{ .update_password | urlquery | replace \"+\" \"%20\" }}@med-tracker-blue-rw.home.svc.cluster.local:5432/medtracker"
  data:
    # This field was created and verified in the blue database's existing 1Password item.
    - secretKey: update_password
      remoteRef:
        key: med-tracker-blue-db
        property: update_password
