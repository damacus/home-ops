---
policies:
  - uid: home-ops-node
    name: Home Ops Explicitly Enrolled Node Compliance
    version: "2.0.0"
    tags:
      mondoo.com/category: security
      mondoo.com/platform: linux
    require:
      - provider: os
    scoring_system: highest impact
    authors:
      - name: Dan Webb
        email: dan.webb@damacus.io
    docs:
      desc: Validate a Radxa host after explicit SSH enrolment into K3s.
    groups:
      - title: Identity and access
        filters: asset.platform == "linux"
        checks:
          - uid: NODE-USER-001
            title: Pi is the fixed administrator with the approved key
            impact: 100
            mql: |
              users.list.where(name == "pi").all(shell == "/bin/bash") &&
              file("/home/pi/.ssh/authorized_keys").content.trim == "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMCLr7NoB34qERAAJNLHKgOy9EJ40smz4F9HhU5d5i8s" &&
              command("stat -c '%a' /home/pi/.ssh/authorized_keys").stdout.trim == "600"
          - uid: NODE-USER-002
            title: Root is locked and SSH is key-only
            impact: 100
            mql: |
              command("sudo getent shadow root | cut -d: -f2 | grep -Eq '^[!*]'").exitcode == 0 &&
              sshd.config.params["PasswordAuthentication"] == "no" &&
              sshd.config.params["ChallengeResponseAuthentication"] == "no" &&
              sshd.config.params["KbdInteractiveAuthentication"] == "no" &&
              sshd.config.params["PermitRootLogin"] == "no"
          - uid: NODE-IDENTITY-001
            title: First boot generated unique host identity
            impact: 100
            mql: |
              os.hostname == /^node-[a-f0-9]{6}$/ &&
              os.machineid != empty &&
              command("test -f /etc/ssh/ssh_host_ed25519_key").exitcode == 0
      - title: Host baseline
        filters: asset.platform == "linux"
        checks:
          - uid: NODE-SYS-001
            title: Locale timezone and swap policy are effective
            impact: 100
            mql: |
              command("timedatectl show --property=Timezone --value").stdout.trim == "Europe/London" &&
              command("locale").stdout.contains("LANG=en_GB.UTF-8") &&
              command("swapon --show").stdout.trim == ""
          - uid: NODE-SYS-002
            title: Cloud-init completed and root filesystem expanded
            impact: 100
            mql: |
              command("cloud-init status").stdout.contains("status: done") &&
              mount.point("/").size > 3221225472
          - uid: NODE-SYS-003
            title: Unattended upgrades are active without automatic reboot
            impact: 100
            mql: |
              command("systemctl is-enabled apt-daily-upgrade.timer").exitcode == 0 &&
              command("systemctl is-active apt-daily-upgrade.timer").exitcode == 0 &&
              file("/etc/apt/apt.conf.d/50unattended-upgrades").content.contains(/Automatic-Reboot\s+"false"/)
          - uid: NODE-STORAGE-001
            title: iSCSI and multipath services are enabled
            impact: 100
            mql: |
              services.any(name == "iscsid" && enabled == true) &&
              services.any(name == "multipathd" && enabled == true)
      - title: Explicit K3s enrolment
        filters: asset.platform == "linux"
        checks:
          - uid: NODE-K3S-001
            title: K3s is enabled and running only after enrolment
            impact: 100
            mql: services.any(name == "k3s" && enabled == true && running == true)
          - uid: NODE-K3S-002
            title: K3s config and token are private
            impact: 100
            mql: |
              command("stat -c '%a' /etc/rancher/k3s/config.yaml").stdout.trim == "600" &&
              command("stat -c '%a' /etc/rancher/k3s/cluster-token").stdout.trim == "600"
          - uid: NODE-K3S-003
            title: K3s config has no unsafe API or kubeconfig modes
            impact: 100
            mql: |
              file("/etc/rancher/k3s/config.yaml").content.contains(/anonymous-auth.*true/) == false &&
              file("/etc/rancher/k3s/config.yaml").content.contains(/write-kubeconfig-mode.*0?644/) == false
          - uid: NODE-K3S-004
            title: K3s uses the baked air-gap archive
            impact: 100
            mql: file("/var/lib/rancher/k3s/agent/images/k3s-airgap-images-arm64.tar").exists
      - title: Cluster status
        filters: asset.platform == "linux"
        checks:
          - uid: NODE-CLUSTER-001
            title: Node is Ready and control-plane
            impact: 100
            mql: |
              command("sudo kubectl get node $(hostname) --no-headers").stdout.contains("Ready") &&
              command("sudo kubectl get node $(hostname) --no-headers").stdout.contains("control-plane")
          - uid: NODE-CLUSTER-002
            title: Kubernetes API is healthy
            impact: 100
            mql: command("sudo kubectl get --raw=/readyz").stdout.trim == "ok"
