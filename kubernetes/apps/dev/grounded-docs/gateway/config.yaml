---
model_list:
  - model_name: "*"
    litellm_params:
      model: openai/*
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-6.1-terra
    litellm_params:
      model: openai/gpt-6.1-terra
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-6.1-sol
    litellm_params:
      model: openai/gpt-6.1-sol
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-6-luna
    litellm_params:
      model: openai/gpt-6-luna
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-6-astra
    litellm_params:
      model: openai/gpt-6-astra
      api_key: os.environ/OPENAI_API_KEY
  - model_name: jev-latest
    litellm_params:
      model: typesafe/jev-latest
      api_key: os.environ/TYPESAFE_API_KEY
  - model_name: smart-router
    litellm_params:
      model: auto_router/complexity_router
      drop_params: true
      complexity_router_config:
        tiers:
          SIMPLE: gpt-6-luna
          MEDIUM: gpt-6.1-sol
          COMPLEX: gpt-6.1-terra
          REASONING: gpt-6-astra
        classifier_type: jev
        jev_classifier_config:
          model: jev-latest
          timeout_ms: 3000
        classifier_fallback: heuristic
      complexity_router_default_model: gpt-6.1-sol
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  ui_access_mode: admin_only
  disable_password_login_when_sso_enabled: true
  disable_env_credential_login: true
litellm_settings:
  set_verbose: false
  turn_off_message_logging: true
  success_callback:
    - prometheus
  failure_callback:
    - prometheus
  request_timeout: 120
  num_retries: 1
mcp_servers:
  home_assistant:
    url: https://home-assistant.ironstone.casa/api/mcp
    transport: http
    auth_type: bearer_token
    auth_value: os.environ/HOME_ASSISTANT_TOKEN
    allow_all_keys: false
  grafana:
    url: http://grafana-mcp.monitoring.svc.cluster.local:8000/mcp
    transport: http
    auth_type: bearer_token
    auth_value: os.environ/GRAFANA_MCP_TOKEN
    allow_all_keys: false
  scrypted:
    url: https://scrypted.ironstone.casa/endpoint/scrypted-mcp/public/mcp
    transport: http
    auth_type: oauth2
    oauth2_flow: authorization_code
    authorization_url: https://scrypted.ironstone.casa/endpoint/scrypted-mcp/public/authorize
    token_url: https://scrypted.ironstone.casa/endpoint/scrypted-mcp/public/token
    registration_url: https://scrypted.ironstone.casa/endpoint/scrypted-mcp/public/register
    allow_all_keys: false
  unifi_network:
    url: http://unifi-network-mcp.dev.svc.cluster.local:3000/mcp
    transport: http
    allow_all_keys: false
  unifi_protect:
    url: http://unifi-protect-mcp.dev.svc.cluster.local:3001/mcp
    transport: http
    allow_all_keys: false
  grounded_docs:
    url: http://grounded-docs.dev.svc.cluster.local:6280/mcp
    transport: http
    allow_all_keys: false
