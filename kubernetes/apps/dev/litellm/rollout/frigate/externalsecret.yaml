---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate-litellm
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: frigate-litellm
  data:
    - secretKey: api-key
      remoteRef:
        key: litellm-frigate
        property: key
