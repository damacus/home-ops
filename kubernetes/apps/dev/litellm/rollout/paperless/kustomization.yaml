---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../home-automation/paperless/app
  - externalsecret.yaml
patches:
  - patch: |
      ---
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: paperless
      spec:
        values:
          controllers:
            paperless:
              containers:
                app:
                  env:
                    PAPERLESS_AI_ENABLED: 'true'
                    PAPERLESS_AI_LLM_BACKEND: openai-like
                    PAPERLESS_AI_LLM_ENDPOINT: http://litellm.dev.svc.cluster.local:4000/v1
                    PAPERLESS_AI_LLM_API_KEY:
                      valueFrom:
                        secretKeyRef:
                          name: paperless-litellm
                          key: api-key
                    PAPERLESS_AI_LLM_MODEL: home-generation
                    PAPERLESS_AI_LLM_EMBEDDING_BACKEND: openai-like
                    PAPERLESS_AI_LLM_EMBEDDING_ENDPOINT: http://litellm.dev.svc.cluster.local:4000/v1
                    PAPERLESS_AI_LLM_EMBEDDING_API_KEY:
                      valueFrom:
                        secretKeyRef:
                          name: paperless-litellm
                          key: api-key
                    PAPERLESS_AI_LLM_EMBEDDING_MODEL: home-embeddings
                    PAPERLESS_AI_LLM_ALLOW_INTERNAL_ENDPOINTS: 'true'
