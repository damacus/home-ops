---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  interval: 30m
  chart:
    spec:
      chart: longhorn
      version: 1.13.0
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false

  values:
    global:
      imagePullSecrets:
        - dockerhub-credentials

    privateRegistry:
      registrySecret: dockerhub-credentials

    monitoring:
      enabled: true
      createPrometheusRules: true

    defaultSettings:
      # Detached backup clones may have a stopped last replica; retain protection
      # for the last running replica while allowing in-place node maintenance.
      nodeDrainPolicy: allow-if-replica-is-stopped

    persistence:
      defaultClass: true
      defaultClassReplicaCount: 2
      defaultDataLocality: best-effort
      defaultReplicaAutoBalance: best-effort
      migratable: false # ReadWriteMany doesn't work if storage is migratable

    ingress:
      enabled: false
