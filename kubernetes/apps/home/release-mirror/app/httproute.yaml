---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: release-mirror-boundary
spec:
  headers:
    customRequestHeaders:
      Forwarded: ""
      X-Forwarded-Host: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: release-mirror-body-limit
spec:
  buffering:
    maxRequestBodyBytes: 1048576
    memRequestBodyBytes: 1048576
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: release-mirror
  annotations:
    external-dns.alpha.kubernetes.io/target: traefik-ext.damacus.io
spec:
  parentRefs:
    - name: traefik-internal
      namespace: network
      sectionName: websecure
  hostnames: [releases.damacus.io]
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: release-mirror-boundary
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: release-mirror-body-limit
      backendRefs:
        - name: release-mirror
          port: 9292
