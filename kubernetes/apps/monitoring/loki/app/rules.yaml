---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-alert-rules
data:
  home-ops.yaml: |
    groups:
      - name: home-ops-log-failures
        interval: 1m
        rules:
          - alert: FrigateCameraRepeatedFailures
            expr: |
              sum by (namespace, app, camera) (
                count_over_time(
                  {app="frigate"}
                  |~ "(?i)(no frames received|ffmpeg process crashed)"
                  | json message="message"
                  | line_format "{{.message}}"
                  | regexp `watchdog\.(?P<camera>[A-Za-z0-9_-]+)`
                  | __error__=""
                  | camera!=""
                  [10m]
                )
              ) >= 3
            for: 5m
            labels:
              severity: warning
              alertgroup: home-ops-logs
            annotations:
              summary: "Frigate camera {{ $labels.camera }} is repeatedly failing"
              description: "At least three camera/FFmpeg failures occurred in ten minutes and the condition persisted for five minutes. Check the camera connection and Frigate logs."
          - alert: IronBridgeDeliveryExhausted
            expr: |
              sum by (namespace, app) (
                count_over_time({app="ironbridge"} |= "bridge_delivery_exhausted" [15m])
              ) > 0
            labels:
              severity: warning
              alertgroup: home-ops-logs
            annotations:
              summary: "IronBridge permanently failed to deliver a message"
              description: "Delivery retries were exhausted in the last fifteen minutes. Inspect the IronBridge error and destination before retrying; avoid duplicate delivery."
          - alert: ApplicationStorageWriteFailure
            expr: |
              sum by (namespace, app, node) (
                count_over_time(
                  {app=~"loki|rustfs|postgresql|frigate|volsync|barman-cloud"}
                  |~ "(?i)(no space left on device|read-only file system|input/output error)"
                  [10m]
                )
              ) > 0
            labels:
              severity: critical
              alertgroup: home-ops-logs
            annotations:
              summary: "{{ $labels.app }} reported a storage failure on {{ $labels.node }}"
              description: "An application reported a full, read-only or failing filesystem in the last ten minutes. Check its volume, node storage and recent writes."
