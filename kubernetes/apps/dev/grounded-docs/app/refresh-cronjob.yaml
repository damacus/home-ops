---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: grounded-docs-refresh
spec:
  suspend: false
  schedule: '0 3 * * 0'
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 21600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: grounded-docs-refresh
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: refresh
              image: ghcr.io/arabold/docs-mcp-server:3.4.1@sha256:3176256f0716fae6052b3350795e9117bff36ef3acbe9ef5f46b2b47033f4f41
              command: [node, /etc/grounded-docs/sync.mjs]
              env:
                - name: GROUNDED_DOCS_SERVER_URL
                  value: http://grounded-docs.dev.svc.cluster.local:8080/api
                - name: DOCS_MCP_TELEMETRY
                  value: 'false'
                - name: HOME
                  value: /tmp
                - name: XDG_CONFIG_HOME
                  value: /tmp/config
                - name: DOCS_MCP_STORE_PATH
                  value: /tmp/data
                - name: OPENAI_API_KEY
                  value: ''
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 25m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: config
                  mountPath: /etc/grounded-docs
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: config
              configMap:
                name: grounded-docs-config
            - name: tmp
              emptyDir: {}
