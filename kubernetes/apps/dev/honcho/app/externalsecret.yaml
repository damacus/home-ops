---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: honcho
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: honcho
  data:
    - secretKey: AUTH_JWT_SECRET
      remoteRef:
        key: honcho
        property: jwt-secret
    - secretKey: LLM_OPENAI_API_KEY
      remoteRef:
        key: litellm-honcho
        property: key
