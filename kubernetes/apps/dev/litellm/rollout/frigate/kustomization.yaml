---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../home-automation/frigate/app
  - externalsecret.yaml
patches:
  - patch: |
      ---
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: frigate
      spec:
        values:
          controllers:
            frigate:
              containers:
                app:
                  env:
                    FRIGATE_GENAI_API_KEY:
                      valueFrom:
                        secretKeyRef:
                          name: frigate-litellm
                          key: api-key
configMapGenerator:
  - name: frigate-configmap
    behavior: replace
    files:
      - config.yaml=config.yml
generatorOptions:
  disableNameSuffixHash: true
