---
# Video is supplied by Frigate from Scrypted; native Reolink supplies events only.
script:
  doorbell_phone_alert:
    alias: Doorbell picture alert on Pixel
    mode: parallel
    max: 5
    fields:
      message:
        description: Optional message for a labelled delivery test
    sequence:
      - action: notify.mobile_app_pixel_9_pro
        data:
          title: Front door
          message: "{{ message | default('Someone pressed the doorbell.', true) }}"
          data:
            image: /api/camera_proxy/camera.doorbell
            clickAction: /?more-info-entity-id=camera.doorbell
            ttl: 0
            priority: high
            channel: alarm_stream
            importance: high
            visibility: public
            tag: front-door-press
            actions:
              - action: URI
                title: View live
                uri: /?more-info-entity-id=camera.doorbell

automation:
  - id: reolink_doorbell_phone_alert
    alias: Front door - ring Pixel
    description: Native Reolink button event; picture and live video use the Scrypted relay through Frigate.
    triggers:
      - trigger: state
        entity_id: binary_sensor.front_door_visitor
        from: "off"
        to: "on"
    actions:
      - action: script.doorbell_phone_alert
    mode: queued
    max: 5
