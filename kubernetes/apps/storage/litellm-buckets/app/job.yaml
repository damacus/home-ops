---
apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-buckets-v1
  namespace: storage
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 4
  # Initial provisioning may wait for External Secrets; Flux bounds each health check.
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rc
          image: rustfs/rc:v0.1.36@sha256:ab024bfebee49a750ce886b4c70963ccd9ddaa03f491704a90710641d7a26699
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          env:
            - name: RUSTFS_ENDPOINT
              value: http://rustfs.storage.svc.cluster.local:9000
            - name: HOME
              value: /tmp
          envFrom:
            - secretRef:
                name: rustfs-credentials
            - secretRef:
                name: rustfs-litellm
          command: [/bin/sh, /scripts/bootstrap.sh, litellm]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: bootstrap-script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: bootstrap-script
          configMap:
            name: rustfs-iam-bootstrap
            defaultMode: 0555
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: litellm-buckets-sync
  namespace: storage
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 4
      activeDeadlineSeconds: 600
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rc
              image: rustfs/rc:v0.1.36@sha256:ab024bfebee49a750ce886b4c70963ccd9ddaa03f491704a90710641d7a26699
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
              env:
                - name: RUSTFS_ENDPOINT
                  value: http://rustfs.storage.svc.cluster.local:9000
                - name: HOME
                  value: /tmp
              envFrom:
                - secretRef:
                    name: rustfs-credentials
                - secretRef:
                    name: rustfs-litellm
              command: [/bin/sh, /scripts/bootstrap.sh, litellm]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: bootstrap-script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: tmp
              emptyDir: {}
            - name: bootstrap-script
              configMap:
                name: rustfs-iam-bootstrap
                defaultMode: 0555
