---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-nfs-csi-hdd
  namespace: home-automation
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 50Gi
  storageClassName: nfs-csi-unas
