---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./HelmRelease.yaml
  - ./pvc.yaml
  - ./networkpolicy.yaml
  - ./mqtt-externalsecret.yaml

configMapGenerator:
  - name: frigate-configmap
    files:
      - config.yaml=./config.yml

generatorOptions:
  disableNameSuffixHash: true
