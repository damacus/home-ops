---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-automation
resources:
  - HelmRelease.yaml
  - ssd-storage.yaml
  - longhorn-storage.yaml
  - externalsecret.yaml
  - httproute-traefik.yaml

configMapGenerator:
  - name: home-assistant-doorbell
    files:
      - doorbell.yaml=doorbell-package.yaml

generatorOptions:
  disableNameSuffixHash: true
