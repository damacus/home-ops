---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spamhaus-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-csi-ssd
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: spamhaus-publisher
spec:
  schedule: '0 3 * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: publisher
              image: python:3.15-alpine@sha256:a0f2e268f2ce8f3709611a90054ec6a8ae31f6251f5896b8648b9bb99835e30a
              command: [python, /scripts/publish.py]
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: data, mountPath: /data}
                - {name: script, mountPath: /scripts, readOnly: true}
          volumes:
            - name: data
              persistentVolumeClaim: {claimName: spamhaus-data}
            - name: script
              configMap: {name: spamhaus-publisher}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spamhaus-http
spec:
  replicas: 1
  selector:
    matchLabels: {app: spamhaus-http}
  template:
    metadata:
      labels: {app: spamhaus-http}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: http
          image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command: [httpd, -f, -p, '8080', -h, /data]
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: spamhaus-data}
---
apiVersion: v1
kind: Service
metadata:
  name: spamhaus-http
  labels: {app: spamhaus-http}
spec:
  selector: {app: spamhaus-http}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spamhaus
  annotations:
    external-dns.alpha.kubernetes.io/target: traefik-int.ironstone.casa
spec:
  hostnames: [spamhaus.ironstone.casa]
  parentRefs:
    - {name: traefik-internal, namespace: network, sectionName: websecure}
  rules:
    - backendRefs:
        - {name: spamhaus-http, port: 8080}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: spamhaus
spec:
  selector:
    matchLabels: {app: spamhaus-http}
  endpoints:
    - {port: http, path: /current/metrics.txt, interval: 5m}
