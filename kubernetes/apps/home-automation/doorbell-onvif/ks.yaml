---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: doorbell-onvif
  namespace: flux-system
spec:
  targetNamespace: home-automation
  path: ./kubernetes/apps/home-automation/doorbell-onvif/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: doorbell-onvif
  prune: true
  dependsOn:
    - name: scrypted
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
