---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: honcho-rustfs-store
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://cnpg-honcho/
    endpointURL: http://rustfs.storage.svc.cluster.local:9000
    s3Credentials:
      accessKeyId:
        name: rustfs-cnpg-honcho
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: rustfs-cnpg-honcho
        key: SECRET_ACCESS_KEY
    data:
      compression: bzip2
    wal:
      compression: bzip2
      maxParallel: 2
