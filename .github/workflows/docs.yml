name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "site_docs/**"
      - "docs/**/*.md"
      - "provisioning/**/*.md"
      - "kubernetes/apps/**/README.md"
      - "config/**"
      - "plugins/**"
      - "frontend/**"
      - "bin/bridgetown"
      - "Gemfile*"
      - "package*.json"
      - "*config.js"
      - "Rakefile"
      - ".ruby-version"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "site_docs/**"
      - "docs/**/*.md"
      - "provisioning/**/*.md"
      - "kubernetes/apps/**/README.md"
      - "config/**"
      - "plugins/**"
      - "frontend/**"
      - "bin/bridgetown"
      - "Gemfile*"
      - "package*.json"
      - "*config.js"
      - "Rakefile"
      - ".ruby-version"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.9"
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.13.1"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build documentation
        env:
          BRIDGETOWN_ENV: production
        run: bundle exec bin/bridgetown deploy

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./output

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-slim
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
