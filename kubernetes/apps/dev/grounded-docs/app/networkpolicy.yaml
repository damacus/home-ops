---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grounded-docs
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grounded-docs
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 6281
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 6280
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grounded-docs-refresh
      ports:
        - port: 8080
          protocol: TCP
