---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: searxng-secret
    template:
      engineVersion: v2
      data:
        settings.yml: |
          use_default_settings: true
          general:
            instance_name: "searxng"
            debug: false
          server:
            secret_key: "{{ .secret_key }}"
            limiter: false
            image_proxy: true
          search:
            safe_search: 0
            formats:
              - html
              - json
  data:
    - secretKey: secret_key
      remoteRef:
        key: n8n-sandbox
        property: searxng_secret_key
